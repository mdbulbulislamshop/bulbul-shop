<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bulbul Enterprise — হিসাব সিস্টেম</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1a3a5c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Bulbul Hisab" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.7.2/Recharts.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Sans Bengali', 'Segoe UI', sans-serif; background: #f0f4f8; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; }
    ::-webkit-scrollbar-thumb { background: #1a3a5c; border-radius: 3px; }
    input, select, button { font-family: 'Noto Sans Bengali', 'Segoe UI', sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;
    const { BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, PieChart, Pie, Cell, Legend } = Recharts;

    // ══════════════════════════════════════════════════
    // স্টোরেজ — localStorage ব্যবহার করবে
    // ══════════════════════════════════════════════════
    const load = (key, def) => {
      try {
        const v = localStorage.getItem(key);
        return v ? JSON.parse(v) : def;
      } catch { return def; }
    };
    const save = (key, val) => {
      try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
    };

    // ══════════════════════════════════════════════════
    // তারিখ ও নম্বর হেল্পার
    // ══════════════════════════════════════════════════
    const today = () => new Date().toISOString().split("T")[0];
    const fmtDate = (d) => {
      if (!d) return "";
      return new Date(d).toLocaleDateString("bn-BD", { day: "2-digit", month: "short", year: "numeric" });
    };
    const fmtNum = (n) => Number(n || 0).toLocaleString("bn-BD");

    // ══════════════════════════════════════════════════
    // মাস্টার ডেটা
    // ══════════════════════════════════════════════════
    const INIT_CUSTOMERS = [
      "CASH CASTOMAR","DILRUBA EL LALBAG","KHOLIL EL LALBAG","TANJIL EL LALBAG",
      "AMIN EL LALBAG","EMONISTOR LALBAG","FATEMA EL LALBAG","FYSAL EL LALBAG",
      "KHAN EL LALBAG","DINAZPUR EL LALBAG","DR EL LALBAG","JAJIRA EL LALBAG",
      "MAERDOA EL LALBAG","MAERDOA NOBABPUR","MASUM EL LALBAG","MORIYOM EL LALBAG",
      "MUNSI EL LALBAG","NOAKHALI EL LALBAG","RITOM","ISLAM AND BROTHER",
      "HK POWER","IMRAN BONGSAL","JAFOR SURITOLA","MASUD DOAGONG",
      "MINTU EL MANIQGONG","RAJIA EL GORADOR","NOWAAKHALI EL","OMORFAARUK",
    ];
    const INIT_SUPPLIERS = [
      "RM LED LIGHTING","SAMIA ENTERPRISE","NEW AMENA EL","IMAM POWER",
      "IR ELECTRICK","AZAD LED","FLOORA CO K2 F2","NEW ISLAM EI K2",
      "SHARMIN TRADE IN","EAKIN EL","RAFIQ EL","BETAR EL","MOON SUPER",
      "OSAN","SWICH PAC ENG K2","GRAMIN","INTEX","BEST LINE HITEK CO",
      "MAX LINE","VEE","SHARIF ELECTRICK","KING BIDDUT BITAN","BONDHU LIGHTING",
      "RITOM EL","MADINA EL","RAJEN AND BROTHERS","JIHAD PIPE","TISA EL",
      "SP ELECTRIC CO","NABIL ENTERPRISE","ELECTRIC PALACE","GFC","JASHIRA EL HOUSE",
    ];
    const INIT_PRODUCTS = [
      "OSAKA CATA 40W","OSAKA CATA 20W","OSAKA CATA 60W","OSAKA ACDC 12W",
      "OSAKA ACDC 18.5W","OSAKA 20W","OSAKA 18W","OSAKA 40W","OSAKA 50W",
      "PS 20W","PS 12W","SS 20W","SSD 20W","SEIKO 20W","IC 5W D","IC 5W A",
      "IC 20W","ROCK STAR 20W","CHINA DIM LICHU","CHINA DIM TOMATO","CHINA 50W",
      "INTEX 34M2","INTEX 34M5","INTEX 33M5","INTEX 813M5","INTEX 814M5",
      "INTEX 23M5","INTEX 24M5","INTEX T STAR MALTY","BEST CTOP 2m","BEST CTOP 5m",
      "BEST LINE 315","BEST LINE 415","BEST LINE 515","MAX017 10F","MAX017 20F",
      "CAPACITOR 3.5","CAPACITOR 2.5","KOHLINUR 30A","KOHLINUR 15A","DP SWICH H",
      "DP SWICH N","CABOL CLIB 6MM","CABOL CLIB 7MM","CABOL CLIB 8MM","CABOL CLIB 10MM",
      "CABOL TAI 10IN","MK DIMAR NORMAL","CHALTHA NORMAL","OSAKA TAP","DEER TAP",
      "NOKIA","COLING BAL","IPS DIMAR","CONVATAR","LED TUB GLASS","DC T8 TUB",
      "GFC 12IN FAN","1HOL BOARD","3HOL BOARD","4HOL BOARD","TATAR",
      "G STAR PENDEL HOLDAR SAPTY","G STAR WINAR SWISS","MC RAJA PLACK",
      "PC SUPER DIMAR MK","VEE 503M5","VEE 504M5","VEE 505M5","VEE ACDC",
      "CANDAR 12W","COSCO 18W","SUN+ ACDC 20W","CLICK MALTY PLACK 4G",
    ];
    const INIT_BANKS = ["DBBL","BRAC BANK","IBBL","SONALI BANK","bKash","Nagad","হাতে নগদ"];

    // ══════════════════════════════════════════════════
    // SHARED COMPONENTS
    // ══════════════════════════════════════════════════
    const Card = ({ children, style = {} }) => (
      <div style={{ background: "#fff", borderRadius: 12, padding: 20, boxShadow: "0 2px 8px rgba(0,0,0,0.06)", marginBottom: 16, ...style }}>{children}</div>
    );

    const Btn = ({ children, onClick, color = "#1a5276", small = false, outline = false, disabled = false }) => (
      <button onClick={onClick} disabled={disabled} style={{
        background: outline ? "transparent" : color, color: outline ? color : "#fff",
        border: `2px solid ${color}`, borderRadius: 8,
        padding: small ? "5px 12px" : "8px 16px",
        cursor: disabled ? "not-allowed" : "pointer",
        fontWeight: 600, fontSize: small ? 12 : 13,
        fontFamily: "'Noto Sans Bengali', sans-serif",
        opacity: disabled ? 0.5 : 1,
      }}>{children}</button>
    );

    const Input = ({ label, value, onChange, type = "text", list, required, placeholder }) => (
      <div style={{ marginBottom: 12 }}>
        {label && <div style={{ fontSize: 12, fontWeight: 600, color: "#2c3e50", marginBottom: 4 }}>{label}{required && <span style={{ color: "red" }}> *</span>}</div>}
        <input type={type} value={value} onChange={e => onChange(e.target.value)} list={list} placeholder={placeholder}
          style={{ width: "100%", padding: "8px 12px", border: "1px solid #dde1e7", borderRadius: 8, fontSize: 13, boxSizing: "border-box", outline: "none" }} />
      </div>
    );

    const Select = ({ label, value, onChange, options, required }) => (
      <div style={{ marginBottom: 12 }}>
        {label && <div style={{ fontSize: 12, fontWeight: 600, color: "#2c3e50", marginBottom: 4 }}>{label}{required && <span style={{ color: "red" }}> *</span>}</div>}
        <select value={value} onChange={e => onChange(e.target.value)}
          style={{ width: "100%", padding: "8px 12px", border: "1px solid #dde1e7", borderRadius: 8, fontSize: 13, background: "#fff" }}>
          <option value="">-- বেছে নিন --</option>
          {options.map(o => <option key={o} value={o}>{o}</option>)}
        </select>
      </div>
    );

    const Table = ({ headers, rows, emptyMsg = "কোনো তথ্য নেই" }) => (
      <div style={{ overflowX: "auto" }}>
        <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
          <thead>
            <tr style={{ background: "#1a3a5c" }}>
              {headers.map(h => <th key={h} style={{ padding: "10px 12px", color: "#fff", fontWeight: 600, textAlign: "left", whiteSpace: "nowrap" }}>{h}</th>)}
            </tr>
          </thead>
          <tbody>
            {rows.length === 0
              ? <tr><td colSpan={headers.length} style={{ padding: 24, textAlign: "center", color: "#7f8c8d" }}>{emptyMsg}</td></tr>
              : rows.map((row, i) => (
                <tr key={i} style={{ background: i % 2 === 0 ? "#f8fafc" : "#fff", borderBottom: "1px solid #eee" }}>
                  {row.map((cell, j) => <td key={j} style={{ padding: "9px 12px", color: "#2c3e50" }}>{cell}</td>)}
                </tr>
              ))
            }
          </tbody>
        </table>
      </div>
    );

    // ══════════════════════════════════════════════════
    // DASHBOARD COMPONENTS
    // ══════════════════════════════════════════════════
    const PIE_COLORS = ["#00d4aa","#54a0ff","#ff9f43","#5f27cd","#ff6b6b","#feca57"];

    const DarkCard = ({ children, style = {} }) => (
      <div style={{ background: "#0f172a", borderRadius: 16, padding: 20, border: "1px solid #1e293b", ...style }}>
        {children}
      </div>
    );

    const SectionTitle = ({ icon, title }) => (
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 16 }}>
        <span style={{ fontSize: 18 }}>{icon}</span>
        <h2 style={{ margin: 0, fontSize: 15, fontWeight: 700, color: "#e2e8f0" }}>{title}</h2>
        <div style={{ flex: 1, height: 1, background: "linear-gradient(to right, #334155, transparent)", marginLeft: 8 }} />
      </div>
    );

    const CustomTooltip = ({ active, payload, label }) => {
      if (active && payload && payload.length) {
        return (
          <div style={{ background: "#1e293b", border: "1px solid #334155", borderRadius: 8, padding: "8px 12px", fontSize: 12 }}>
            <div style={{ color: "#94a3b8", marginBottom: 4 }}>{label}</div>
            {payload.map((p, i) => (
              <div key={i} style={{ color: p.color, fontWeight: 600 }}>
                {p.name}: ৳{Number(p.value).toLocaleString()}
              </div>
            ))}
          </div>
        );
      }
      return null;
    };

    // ══════════════════════════════════════════════════
    // HOME PAGE
    // ══════════════════════════════════════════════════
    function HomePage({ totalSales, totalPurchase, totalCustDue, totalSuppDue, stockMap, sales, purchases }) {
      const productSales = {};
      sales.forEach(s => { productSales[s.product] = (productSales[s.product] || 0) + Number(s.qty || 0); });
      const topProducts = Object.entries(productSales).sort(([,a],[,b]) => b-a).slice(0,8)
        .map(([name, qty]) => ({ name: name.length > 18 ? name.slice(0,18)+"…" : name, qty }));

      const monthSales = {};
      sales.forEach(s => {
        if (!s.date) return;
        const m = s.date.slice(0,7);
        monthSales[m] = (monthSales[m] || 0) + Number(s.total || 0);
      });
      const monthlySalesData = Object.entries(monthSales).sort().slice(-6)
        .map(([m, v]) => ({ month: m.slice(5)+" মাস", value: v }));

      const recentSales = [...sales].reverse().slice(0,6);
      const totalProfit = sales.reduce((s,r) => s + Number(r.profit||0), 0);
      const totalStockValue = Object.entries(stockMap).reduce((s,[name,qty]) => {
        if (qty <= 0) return s;
        const lp = [...purchases].reverse().find(p => p.product === name);
        return s + qty * Number(lp?.price || 0);
      }, 0);

      const pieData = [
        { name: "বিক্রয়", value: totalSales },
        { name: "ক্রয়", value: totalPurchase },
        { name: "কাস্টমার বাকি", value: totalCustDue },
        { name: "সাপ্লায়ার বাকি", value: totalSuppDue },
      ].filter(d => d.value > 0);

      const negStock = Object.entries(stockMap).filter(([,v]) => v < 0);
      const lowStock = Object.entries(stockMap).filter(([,v]) => v > 0 && v <= 5);

      return (
        <div style={{ background: "linear-gradient(135deg, #0a0f1e 0%, #0d1b2a 100%)", minHeight: "100vh", margin: -20, padding: 20 }}>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(160px, 1fr))", gap: 12, marginBottom: 20 }}>
            {[
              { label: "মোট বিক্রয়", value: totalSales, color: "#00d4aa", bg: "#00d4aa18", icon: "💰" },
              { label: "মোট ক্রয়", value: totalPurchase, color: "#54a0ff", bg: "#54a0ff18", icon: "🛒" },
              { label: "মোট লাভ", value: totalProfit, color: totalProfit >= 0 ? "#2ecc71" : "#ff6b6b", bg: "#2ecc7118", icon: "📈" },
              { label: "স্টক মূল্য", value: totalStockValue, color: "#ff9f43", bg: "#ff9f4318", icon: "📦" },
              { label: "কাস্টমার বাকি", value: totalCustDue, color: "#ff6b6b", bg: "#ff6b6b18", icon: "👥" },
              { label: "সাপ্লায়ার বাকি", value: totalSuppDue, color: "#feca57", bg: "#feca5718", icon: "🏪" },
            ].map((d,i) => (
              <div key={i} style={{ background: d.bg, border: `1px solid ${d.color}30`, borderRadius: 16, padding: "14px 16px", position: "relative", overflow: "hidden" }}>
                <div style={{ fontSize: 22 }}>{d.icon}</div>
                <div style={{ fontSize: 18, fontWeight: 900, color: d.color, fontFamily: "monospace", marginTop: 4 }}>৳{fmtNum(d.value)}</div>
                <div style={{ fontSize: 11, color: "#94a3b8", marginTop: 2 }}>{d.label}</div>
              </div>
            ))}
          </div>

          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16, marginBottom: 16 }}>
            <DarkCard>
              <SectionTitle icon="🏆" title="সর্বাধিক বিক্রিত পণ্য" />
              {topProducts.length === 0
                ? <div style={{ color: "#475569", textAlign: "center", padding: 20 }}>এখনো বিক্রয় নেই</div>
                : <ResponsiveContainer width="100%" height={220}>
                    <BarChart data={topProducts} layout="vertical" barSize={12}>
                      <CartesianGrid strokeDasharray="3 3" stroke="#1e293b" horizontal={false} />
                      <XAxis type="number" tick={{ fill: "#64748b", fontSize: 10 }} />
                      <YAxis type="category" dataKey="name" width={130} tick={{ fill: "#94a3b8", fontSize: 10 }} />
                      <Tooltip content={<CustomTooltip />} />
                      <Bar dataKey="qty" name="বিক্রয় (পিস)" fill="#00d4aa" radius={[0,6,6,0]} />
                    </BarChart>
                  </ResponsiveContainer>
              }
            </DarkCard>

            <DarkCard>
              <SectionTitle icon="📊" title="মাসিক বিক্রয় (টাকা)" />
              {monthlySalesData.length === 0
                ? <div style={{ color: "#475569", textAlign: "center", padding: 20 }}>এখনো ডেটা নেই</div>
                : <ResponsiveContainer width="100%" height={220}>
                    <BarChart data={monthlySalesData} barSize={28}>
                      <CartesianGrid strokeDasharray="3 3" stroke="#1e293b" />
                      <XAxis dataKey="month" tick={{ fill: "#64748b", fontSize: 10 }} />
                      <YAxis tick={{ fill: "#64748b", fontSize: 10 }} tickFormatter={v => `${(v/1000).toFixed(0)}k`} />
                      <Tooltip content={<CustomTooltip />} />
                      <defs>
                        <linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">
                          <stop offset="0%" stopColor="#54a0ff" />
                          <stop offset="100%" stopColor="#5f27cd" stopOpacity={0.6} />
                        </linearGradient>
                      </defs>
                      <Bar dataKey="value" name="বিক্রয়" fill="url(#sg)" radius={[6,6,0,0]} />
                    </BarChart>
                  </ResponsiveContainer>
              }
            </DarkCard>
          </div>

          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>
            <DarkCard>
              <SectionTitle icon="🕐" title="সাম্প্রতিক বিক্রয়" />
              {recentSales.length === 0
                ? <div style={{ color: "#475569", textAlign: "center", padding: 20 }}>এখনো বিক্রয় নেই</div>
                : recentSales.map((s,i) => (
                  <div key={i} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "10px 0", borderBottom: "1px solid #1e293b" }}>
                    <div>
                      <div style={{ fontSize: 13, fontWeight: 600, color: "#e2e8f0" }}>{s.customer}</div>
                      <div style={{ fontSize: 11, color: "#64748b" }}>{s.product} × {s.qty} | {fmtDate(s.date)}</div>
                    </div>
                    <div style={{ textAlign: "right" }}>
                      <div style={{ fontSize: 13, fontWeight: 700, color: "#00d4aa" }}>৳{fmtNum(s.total)}</div>
                      {s.profit > 0 && <div style={{ fontSize: 11, color: "#2ecc71" }}>লাভ: ৳{fmtNum(s.profit)}</div>}
                    </div>
                  </div>
                ))
              }
            </DarkCard>

            <DarkCard>
              <SectionTitle icon="⚠️" title="স্টক সতর্কতা" />
              {negStock.length === 0 && lowStock.length === 0
                ? <div style={{ color: "#2ecc71", textAlign: "center", padding: 12, fontSize: 13 }}>✅ সব স্টক ঠিকঠাক</div>
                : [...negStock, ...lowStock].slice(0,6).map(([name,qty]) => (
                  <div key={name} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 12px", borderRadius: 8, marginBottom: 6, background: qty < 0 ? "#ff6b6b10" : "#ff9f4310", border: `1px solid ${qty < 0 ? "#ff6b6b30" : "#ff9f4330"}` }}>
                    <span style={{ fontSize: 13, color: "#e2e8f0" }}>{qty < 0 ? "🔴" : "🟡"} {name}</span>
                    <span style={{ fontWeight: 700, color: qty < 0 ? "#ff6b6b" : "#ff9f43" }}>{qty}</span>
                  </div>
                ))
              }
              {pieData.length > 0 && (
                <>
                  <div style={{ marginTop: 16 }}><SectionTitle icon="🥧" title="ব্যবসার চিত্র" /></div>
                  <ResponsiveContainer width="100%" height={150}>
                    <PieChart>
                      <Pie data={pieData} cx="50%" cy="50%" outerRadius={55} innerRadius={28} dataKey="value" paddingAngle={3} stroke="none">
                        {pieData.map((_,i) => <Cell key={i} fill={PIE_COLORS[i % PIE_COLORS.length]} />)}
                      </Pie>
                      <Tooltip content={<CustomTooltip />} />
                      <Legend wrapperStyle={{ fontSize: 10, color: "#94a3b8" }} />
                    </PieChart>
                  </ResponsiveContainer>
                </>
              )}
            </DarkCard>
          </div>
        </div>
      );
    }

    // ══════════════════════════════════════════════════
    // PURCHASE PAGE
    // ══════════════════════════════════════════════════
    function PurchasePage({ purchases, setPurchases, suppliers, products, showToast }) {
      const [header, setHeader] = useState({ date: today(), supplier: "", memo: "", paid: "", bank: "হাতে নগদ" });
      const setH = (k,v) => setHeader(h => ({ ...h, [k]: v }));
      const emptyLine = { product: "", qty: "", price: "", discount: "" };
      const [lines, setLines] = useState([{ ...emptyLine, _id: Date.now() }]);
      const setLine = (idx,k,v) => {
        setLines(ls => {
          const updated = ls.map((l,i) => i===idx ? { ...l, [k]: v } : l);
          const last = updated[updated.length-1];
          if (idx === updated.length-1 && (last.product || last.qty || last.price)) {
            return [...updated, { ...emptyLine, _id: Date.now()+Math.random() }];
          }
          return updated;
        });
      };
      const removeLine = (idx) => setLines(ls => ls.length > 1 ? ls.filter((_,i) => i!==idx) : ls);
      const [search, setSearch] = useState("");

      const lineTotal = (l) => Number(l.qty||0) * Number(l.price||0) - Number(l.discount||0);
      const grandTotal = lines.reduce((s,l) => s + lineTotal(l), 0);
      const due = grandTotal - Number(header.paid||0);

      const submit = () => {
        if (!header.supplier) return showToast("সাপ্লায়ারের নাম দিন", "err");
        const validLines = lines.filter(l => l.product && l.qty && l.price);
        if (validLines.length === 0) return showToast("কমপক্ষে একটি পণ্য দিন", "err");
        const memoId = Date.now();
        const newEntries = validLines.map((l,i) => ({
          ...header, product: l.product, qty: l.qty, price: l.price,
          discount: l.discount, total: lineTotal(l), due: i===0 ? due : 0,
          memoId, id: memoId+i,
        }));
        setPurchases(p => [...p, ...newEntries]);
        setHeader({ date: today(), supplier: "", memo: "", paid: "", bank: "হাতে নগদ" });
        setLines([{ ...emptyLine, _id: Date.now() }]);
        showToast(`✅ ${validLines.length}টি পণ্য সংরক্ষণ হয়েছে`);
      };

      const grouped = [];
      const seen = new Set();
      [...purchases].reverse().forEach(p => {
        const key = p.memoId || p.id;
        if (!seen.has(key)) {
          seen.add(key);
          const group = purchases.filter(x => (x.memoId||x.id)===key);
          grouped.push({ key, group, supplier: p.supplier, date: p.date, memo: p.memo, due: group[0]?.due||0, total: group.reduce((s,x) => s+Number(x.total||0),0) });
        }
      });
      const filtered = grouped.filter(g =>
        g.supplier?.toLowerCase().includes(search.toLowerCase()) ||
        g.group.some(x => x.product?.toLowerCase().includes(search.toLowerCase()))
      );

      return (
        <div>
          <datalist id="dl_sup">{suppliers.map(s => <option key={s} value={s} />)}</datalist>
          <datalist id="dl_pro">{products.map(s => <option key={s} value={s} />)}</datalist>

    // ══════════════════════════════════════════════════
    // SALES PAGE
    // ══════════════════════════════════════════════════
    function SalesPage({ sales, setSales, customers, products, showToast, stockMap, purchases }) {
      const [header, setHeader] = useState({ date: today(), customer: "", billNo: "", paid: "", bank: "হাতে নগদ" });
      const setH = (k,v) => setHeader(h => ({ ...h, [k]: v }));
      const emptyLine = { product: "", qty: "", price: "", costPrice: "", discount: "" };
      const [lines, setLines] = useState([{ ...emptyLine, _id: Date.now() }]);

      const getLastCostPrice = (productName) => {
        const last = [...purchases].reverse().find(p => p.product === productName);
        return last ? last.price : "";
      };

      const setLine = (idx,k,v) => {
        setLines(ls => {
          let updated = ls.map((l,i) => {
            if (i !== idx) return l;
            const newLine = { ...l, [k]: v };
            if (k === "product" && v) newLine.costPrice = getLastCostPrice(v);
            return newLine;
          });
          const last = updated[updated.length-1];
          if (idx === updated.length-1 && (last.product || last.qty || last.price)) {
            return [...updated, { ...emptyLine, _id: Date.now()+Math.random() }];
          }
          return updated;
        });
      };
      const removeLine = (idx) => setLines(ls => ls.length>1 ? ls.filter((_,i) => i!==idx) : ls);
      const [search, setSearch] = useState("");

      const lineTotal = (l) => Number(l.qty||0)*Number(l.price||0) - Number(l.discount||0);
      const lineProfit = (l) => {
        const cost = Number(l.costPrice||0);
        const qty = Number(l.qty||0);
        if (!cost || !qty) return 0;
        return lineTotal(l) - cost*qty;
      };
      const grandTotal = lines.reduce((s,l) => s+lineTotal(l), 0);
      const totalProfit = sales.reduce((s,r) => s+Number(r.profit||0), 0);
      const due = header.customer === "CASH CASTOMAR" ? 0 : grandTotal - Number(header.paid||0);

      const submit = () => {
        if (!header.customer) return showToast("কাস্টমারের নাম দিন","err");
        const validLines = lines.filter(l => l.product && l.qty && l.price);
        if (validLines.length === 0) return showToast("কমপক্ষে একটি পণ্য দিন","err");
        for (const l of validLines) {
          const st = stockMap[l.product] || 0;
          if (Number(l.qty) > st) return showToast(`${l.product} — স্টকে মাত্র ${st}টি!`,"err");
        }
        const billId = Date.now();
        const newEntries = validLines.map((l,i) => ({
          ...header, product: l.product, qty: l.qty, price: l.price,
          costPrice: l.costPrice, discount: l.discount,
          total: lineTotal(l), profit: lineProfit(l),
          due: i===0 ? due : 0, billId, id: billId+i,
        }));
        setSales(s => [...s, ...newEntries]);
        setHeader({ date: today(), customer: "", billNo: "", paid: "", bank: "হাতে নগদ" });
        setLines([{ ...emptyLine, _id: Date.now() }]);
        showToast(`✅ ${validLines.length}টি পণ্য বিক্রয় সংরক্ষণ হয়েছে`);
      };

      const grouped = [];
      const seen = new Set();
      [...sales].reverse().forEach(s => {
        const key = s.billId || s.id;
        if (!seen.has(key)) {
          seen.add(key);
          const group = sales.filter(x => (x.billId||x.id)===key);
          grouped.push({ key, group, customer: s.customer, date: s.date, billNo: s.billNo, due: group[0]?.due||0, total: group.reduce((t,x) => t+Number(x.total||0),0), profit: group.reduce((t,x) => t+Number(x.profit||0),0) });
        }
      });
      const filtered = grouped.filter(g =>
        g.customer?.toLowerCase().includes(search.toLowerCase()) ||
        g.group.some(x => x.product?.toLowerCase().includes(search.toLowerCase()))
      );

      return (
        <div>
          <datalist id="dl_cus">{customers.map(s => <option key={s} value={s} />)}</datalist>
          <datalist id="dl_pro2">{products.map(s => <option key={s} value={s} />)}</datalist>

          <div style={{ background: totalProfit>=0?"linear-gradient(135deg,#27ae60,#2ecc71)":"linear-gradient(135deg,#c0392b,#e74c3c)", borderRadius: 12, padding: "16px 24px", marginBottom: 16, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <div>
              <div style={{ color: "#fff", fontSize: 13, opacity: 0.85 }}>এখন পর্যন্ত মোট লাভ</div>
              <div style={{ color: "#fff", fontSize: 32, fontWeight: 900, fontFamily: "monospace" }}>৳{fmtNum(totalProfit)}</div>
            </div>
            <div style={{ fontSize: 48 }}>{totalProfit>=0?"📈":"📉"}</div>
          </div>

          <Card>
            <h3 style={{ margin: "0 0 16px", color: "#1a5276", fontSize: 15 }}>💰 নতুন বিক্রয় — একাধিক পণ্য</h3>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(160px, 1fr))", gap: 12, marginBottom: 16, padding: "12px 16px", background: "#eafaf1", borderRadius: 10 }}>
              <Input label="তারিখ *" type="date" value={header.date} onChange={v => setH("date",v)} />
              <Input label="কাস্টমার *" value={header.customer} onChange={v => setH("customer",v)} list="dl_cus" placeholder="কাস্টমার নাম" />
              <Input label="বিল নং" value={header.billNo} onChange={v => setH("billNo",v)} placeholder="বিল নম্বর" />
              <Input label="পরিশোধ (মোট)" type="number" value={header.paid} onChange={v => setH("paid",v)} placeholder="0 = পুরো বাকি" />
              <Select label="মাধ্যম" value={header.bank} onChange={v => setH("bank",v)} options={["হাতে নগদ","DBBL","BRAC BANK","IBBL","bKash","Nagad"]} />
            </div>
            <div style={{ marginBottom: 12, borderRadius: 8, overflow: "hidden", border: "1px solid #e2e8f0" }}>
              <div style={{ display: "grid", gridTemplateColumns: "2fr 70px 100px 100px 70px 36px", gap: 8, padding: "8px 10px", background: "#16a085" }}>
                {["পণ্যের নাম","পরিমাণ","বিক্রয় দাম","ক্রয় দাম","ডিসকাউন্ট",""].map(h => (
                  <div key={h} style={{ color: "#fff", fontSize: 12, fontWeight: 600 }}>{h}</div>
                ))}
              </div>
              {lines.map((l,idx) => {
                const st = stockMap[l.product] || 0;
                const lp = l.costPrice && l.qty && l.price ? lineTotal(l) - Number(l.qty)*Number(l.costPrice) : null;
                return (
                  <div key={l._id}>
                    <div style={{ display: "grid", gridTemplateColumns: "2fr 70px 100px 100px 70px 36px", gap: 8, padding: "6px 10px", background: idx%2===0?"#f8fafc":"#fff", borderBottom: "1px solid #eee", alignItems: "center" }}>
                      <input value={l.product} onChange={e => setLine(idx,"product",e.target.value)} list="dl_pro2" placeholder="পণ্য লিখুন..."
                        style={{ padding: "6px 10px", border: "1px solid #dde1e7", borderRadius: 6, fontSize: 13, width: "100%", boxSizing: "border-box" }} />
                      <input type="number" value={l.qty} onChange={e => setLine(idx,"qty",e.target.value)} placeholder="0"
                        style={{ padding: "6px 8px", border: "1px solid #dde1e7", borderRadius: 6, fontSize: 13, width: "100%", boxSizing: "border-box" }} />
                      <input type="number" value={l.price} onChange={e => setLine(idx,"price",e.target.value)} placeholder="0"
                        style={{ padding: "6px 8px", border: "1px solid #dde1e7", borderRadius: 6, fontSize: 13, width: "100%", boxSizing: "border-box" }} />
                      <input type="number" value={l.costPrice} onChange={e => setLine(idx,"costPrice",e.target.value)} placeholder="স্বয়ংক্রিয়"
                        style={{ padding: "6px 8px", border: "1px solid #e8f5e9", borderRadius: 6, fontSize: 13, width: "100%", boxSizing: "border-box", background: "#f0fff4" }} />
                      <input type="number" value={l.discount} onChange={e => setLine(idx,"discount",e.target.value)} placeholder="0"
                        style={{ padding: "6px 8px", border: "1px solid #dde1e7", borderRadius: 6, fontSize: 13, width: "100%", boxSizing: "border-box" }} />
                      <button onClick={() => removeLine(idx)} disabled={lines.length===1}
                        style={{ background: "none", border: "none", cursor: lines.length===1?"not-allowed":"pointer", color: "#e74c3c", fontSize: 18 }}>🗑️</button>
                    </div>
                    {(l.product||l.qty||l.price) && (
                      <div style={{ display: "flex", gap: 16, padding: "4px 10px", background: "#fafafa", fontSize: 12, color: "#555" }}>
                        {l.product && <span>স্টক: <strong style={{ color: st<=0?"#e74c3c":"#1a5276" }}>{st}</strong></span>}
                        {l.qty && l.price && <span>লাইন মোট: <strong>৳{fmtNum(lineTotal(l))}</strong></span>}
                        {lp !== null && <span style={{ color: lp>=0?"#27ae60":"#e74c3c", fontWeight: 700 }}>{lp>=0?"✅ লাভ":"❌ লোকসান"}: ৳{fmtNum(Math.abs(lp))}</span>}
                      </div>
                    )}
                  </div>
                );
              })}
              <div style={{ padding: "8px 10px", background: "#f8fafc", borderTop: "2px dashed #dde1e7" }}>
                <span style={{ fontSize: 12, color: "#94a3b8" }}>💡 পণ্যের নাম লিখলেই নিচে নতুন লাইন আসবে। ক্রয় দাম স্বয়ংক্রিয় বসবে।</span>
              </div>
            </div>
            <div style={{ display: "flex", gap: 20, padding: "12px 16px", background: "#f0f4f8", borderRadius: 8, marginBottom: 12, fontSize: 13, alignItems: "center", flexWrap: "wrap" }}>

    // ══════════════════════════════════════════════════
    // BILL SEARCH PAGE
    // ══════════════════════════════════════════════════
    function BillSearchPage({ sales, purchases }) {
      const [query, setQuery] = useState("");
      const [type, setType] = useState("both");
      const q = query.trim().toLowerCase();

      const saleBills = {};
      sales.forEach(s => {
        const key = s.billId || s.id;
        if (!saleBills[key]) saleBills[key] = { key, billNo: s.billNo||"", customer: s.customer, date: s.date, items: [], total: 0, profit: 0 };
        saleBills[key].items.push(s);
        saleBills[key].total += Number(s.total||0);
        saleBills[key].profit += Number(s.profit||0);
      });
      Object.values(saleBills).forEach(b => { b.due = b.items[0]?.due||0; });

      const purchaseMemos = {};
      purchases.forEach(p => {
        const key = p.memoId || p.id;
        if (!purchaseMemos[key]) purchaseMemos[key] = { key, memo: p.memo||"", supplier: p.supplier, date: p.date, items: [], total: 0 };
        purchaseMemos[key].items.push(p);
        purchaseMemos[key].total += Number(p.total||0);
      });
      Object.values(purchaseMemos).forEach(m => { m.due = m.items[0]?.due||0; });

      const matchedSales = q ? Object.values(saleBills).filter(b =>
        b.billNo?.toLowerCase().includes(q) || b.customer?.toLowerCase().includes(q) ||
        b.items.some(i => i.product?.toLowerCase().includes(q))
      ) : Object.values(saleBills);

      const matchedPurchases = q ? Object.values(purchaseMemos).filter(m =>
        m.memo?.toLowerCase().includes(q) || m.supplier?.toLowerCase().includes(q) ||
        m.items.some(i => i.product?.toLowerCase().includes(q))
      ) : Object.values(purchaseMemos);

      const showPurchase = type==="both" || type==="purchase";

      return (
        <div>
          <Card>
            <div style={{ fontSize: 18, fontWeight: 800, color: "#1a5276", marginBottom: 6 }}>🔍 বিল / মেমো সার্চ</div>
            <div style={{ fontSize: 12, color: "#7f8c8d", marginBottom: 14 }}>বিল নম্বর, মেমো নম্বর, কাস্টমার, সাপ্লায়ার বা পণ্যের নাম লিখুন</div>

                  padding: "7px 18px", borderRadius: 20, border: "2px solid #1a5276", cursor: "pointer",
                  background: type===k?"#1a5276":"#fff", color: type===k?"#fff":"#1a5276",
                  fontWeight: 700, fontSize: 13, fontFamily: "'Noto Sans Bengali',sans-serif"
                }}>{l}</button>

              {q && <span style={{ marginLeft: "auto", fontSize: 12, color: "#1a5276", fontWeight: 600, alignSelf: "center" }}>
                {showSales?matchedSales.length:0} বিক্রয় + {showPurchase?matchedPurchases.length:0} ক্রয়
              </span>}
            </div>
          </Card>

          {showSales && matchedSales.sort((a,b) => b.date>a.date?1:-1).map(b => (
            <div key={b.key} style={{ marginBottom: 12, border: "1px solid #e2e8f0", borderRadius: 12, overflow: "hidden" }}>
              <div style={{ background: "#16a085", padding: "12px 16px", display: "flex", justifyContent: "space-between", flexWrap: "wrap", gap: 8 }}>
                <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
                  <span style={{ background: "#fff", color: "#16a085", fontSize: 11, fontWeight: 800, padding: "2px 8px", borderRadius: 8 }}>💰 বিক্রয়</span>
                  <span style={{ color: "#fff", fontWeight: 800 }}>{b.customer}</span>
                  {b.billNo && <span style={{ background: "#0e7a63", color: "#fff", fontSize: 12, padding: "2px 10px", borderRadius: 8 }}>বিল #{b.billNo}</span>}
                  <span style={{ color: "#a8e6cf", fontSize: 12 }}>{fmtDate(b.date)}</span>
                </div>
                <div style={{ display: "flex", gap: 14 }}>
                  <span style={{ color: "#fff", fontWeight: 700 }}>মোট: ৳{fmtNum(b.total)}</span>
                  {b.profit!==0 && <span style={{ color: b.profit>=0?"#a8e6cf":"#ffcccc", fontWeight: 700 }}>লাভ: ৳{fmtNum(b.profit)}</span>}
                  <span style={{ color: b.due>0?"#ffe082":"#a8e6cf", fontWeight: 700 }}>বাকি: ৳{fmtNum(b.due)}</span>
                </div>
              </div>
              {b.items.map((s,i) => (
                <div key={i} style={{ display: "flex", gap: 16, padding: "8px 16px", background: i%2===0?"#f8fafc":"#fff", fontSize: 13 }}>
                  <span style={{ flex: 2 }}>💡 {s.product}</span>
                  <span style={{ color: "#7f8c8d" }}>×{s.qty} পিস</span>
                  <span>৳{fmtNum(s.price)}/পিস</span>
                  {Number(s.profit)!==0 && <span style={{ color: s.profit>=0?"#27ae60":"#e74c3c", fontWeight: 600 }}>লাভ: ৳{fmtNum(s.profit)}</span>}
                  <span style={{ marginLeft: "auto", fontWeight: 700 }}>৳{fmtNum(s.total)}</span>
                </div>
              ))}
            </div>
          ))}

          {showPurchase && matchedPurchases.sort((a,b) => b.date>a.date?1:-1).map(m => (
            <div key={m.key} style={{ marginBottom: 12, border: "1px solid #e2e8f0", borderRadius: 12, overflow: "hidden" }}>
              <div style={{ background: "#1a3a5c", padding: "12px 16px", display: "flex", justifyContent: "space-between", flexWrap: "wrap", gap: 8 }}>
                <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
                  <span style={{ background: "#fff", color: "#1a3a5c", fontSize: 11, fontWeight: 800, padding: "2px 8px", borderRadius: 8 }}>🛒 ক্রয়</span>
                  <span style={{ color: "#fff", fontWeight: 800 }}>{m.supplier}</span>
                  {m.memo && <span style={{ background: "#2c5282", color: "#fff", fontSize: 12, padding: "2px 10px", borderRadius: 8 }}>মেমো #{m.memo}</span>}
                  <span style={{ color: "#94a3b8", fontSize: 12 }}>{fmtDate(m.date)}</span>
                </div>
                <div style={{ display: "flex", gap: 14 }}>
                  <span style={{ color: "#2ecc71", fontWeight: 700 }}>মোট: ৳{fmtNum(m.total)}</span>
                  <span style={{ color: m.due>0?"#ff9f43":"#2ecc71", fontWeight: 700 }}>বাকি: ৳{fmtNum(m.due)}</span>
                </div>
              </div>
              {m.items.map((p,i) => (
                <div key={i} style={{ display: "flex", gap: 16, padding: "8px 16px", background: i%2===0?"#f8fafc":"#fff", fontSize: 13 }}>
                  <span style={{ flex: 2 }}>📦 {p.product}</span>
                  <span style={{ color: "#7f8c8d" }}>×{p.qty} পিস</span>
                  <span>৳{fmtNum(p.price)}/পিস</span>
                  <span style={{ marginLeft: "auto", fontWeight: 700 }}>৳{fmtNum(p.total)}</span>
                </div>
              ))}
            </div>
          ))}

          {!q && <div style={{ textAlign: "center", padding: 48, color: "#94a3b8", background: "#fff", borderRadius: 12 }}>
            <div style={{ fontSize: 48, marginBottom: 12 }}>🔍</div>
            <div>বিল নম্বর বা মেমো নম্বর লিখুন</div>
          </div>}
          {q && matchedSales.length===0 && matchedPurchases.length===0 && <div style={{ textAlign: "center", padding: 48, color: "#7f8c8d", background: "#fff", borderRadius: 12 }}>
            <div style={{ fontSize: 40, marginBottom: 12 }}>🔍</div>
            <div>"{query}" — কোনো রেজাল্ট নেই</div>
          </div>}
        </div>
      );
    }

    // ══════════════════════════════════════════════════
    // STOCK PAGE
    // ══════════════════════════════════════════════════
    function StockPage({ stockMap, products, purchases, sales }) {
      const [filter, setFilter] = useState("all");
      const [search, setSearch] = useState("");
      const allProducts = [...new Set([...products, ...Object.keys(stockMap)])];
      const rows = allProducts.map(name => {
        const qty = stockMap[name]||0;
        const bought = purchases.filter(p=>p.product===name).reduce((s,p)=>s+Number(p.qty||0),0);
        const sold = sales.filter(s=>s.product===name).reduce((t,s)=>t+Number(s.qty||0),0);
        const lp = [...purchases].reverse().find(p=>p.product===name);
        const costPrice = lp ? Number(lp.price||0) : 0;
        return { name, qty, bought, sold, costPrice, stockValue: qty>0 ? qty*costPrice : 0 };
      }).filter(r => {
        if (filter==="low") return r.qty<=5 && r.qty>0;
        if (filter==="neg") return r.qty<0;
        if (filter==="ok") return r.qty>5;
        return true;
      }).filter(r => r.name.toLowerCase().includes(search.toLowerCase()));

      const sc = qty => qty<0?"#e74c3c":qty<=5?"#f39c12":"#2ecc71";
      const sl = qty => qty<0?"❌ নেগেটিভ":qty<=5?"⚠️ কম":"✅ ঠিক";
      const totalVal = rows.reduce((s,r)=>s+r.stockValue,0);

      return (
        <div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(160px,1fr))", gap: 14, marginBottom: 16 }}>
            {[
              { l: "📦 মোট স্টক মূল্য", v: `৳${fmtNum(totalVal)}`, c: "#3498db" },
              { l: "✅ পণ্য আছে", v: `${rows.filter(r=>r.qty>0).length}টি`, c: "#2ecc71" },
              { l: "❌ নেগেটিভ", v: `${rows.filter(r=>r.qty<0).length}টি`, c: "#e74c3c" },
            ].map((d,i) => (
              <div key={i} style={{ background: "#fff", borderRadius: 12, padding: "14px 18px", borderTop: `4px solid ${d.c}`, boxShadow: "0 2px 8px rgba(0,0,0,0.06)" }}>
                <div style={{ fontSize: 12, color: "#7f8c8d" }}>{d.l}</div>
                <div style={{ fontSize: 22, fontWeight: 900, color: d.c }}>{d.v}</div>
              </div>
            ))}
          </div>
          <Card>
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 14 }}>
              {[["all","সব"],["ok","ঠিকঠাক"],["low","কম স্টক"],["neg","নেগেটিভ"]].map(([k,l]) => (
                <Btn key={k} small color={filter===k?"#1a5276":"#95a5a6"} onClick={()=>setFilter(k)}>{l}</Btn>
              ))}
              <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 পণ্য খুঁজুন..."
                style={{ padding: "5px 12px", border: "1px solid #dde1e7", borderRadius: 8, fontSize: 13, marginLeft: "auto" }} />
            </div>
            <Table
              headers={["পণ্যের নাম","ক্রয়","বিক্রয়","স্টক","একক দাম","স্টক মূল্য","অবস্থা"]}
              rows={rows.map(r => [
                r.name, r.bought, r.sold,
                <span style={{ fontWeight: 800, color: sc(r.qty), fontSize: 15 }}>{r.qty}</span>,
                r.costPrice ? `৳${fmtNum(r.costPrice)}` : "—",
                r.stockValue>0 ? <span style={{ fontWeight: 700, color: "#3498db" }}>৳{fmtNum(r.stockValue)}</span> : "—",
                <span style={{ color: sc(r.qty), fontWeight: 600 }}>{sl(r.qty)}</span>,
              ])}
            />
          </Card>
        </div>
      );
    }

    // CUSTOMER DUE PAGE
    // ══════════════════════════════════════════════════
    function CustomerDuePage({ customers, customerDue, payments, setPayments, sales, showToast }) {
      const [selected, setSelected] = useState("");
      const [payForm, setPayForm] = useState({ date: today(), amount: "", bank: "হাতে নগদ", note: "" });
      const [search, setSearch] = useState("");
      const custList = [...new Set([...customers, ...Object.keys(customerDue)])].filter(c=>c!=="CASH CASTOMAR").filter(c=>c.toLowerCase().includes(search.toLowerCase()));
      const custSales = sales.filter(s=>s.customer===selected).reverse();
      const custPayments = payments.filter(p=>p.customer===selected).reverse();
      const due = customerDue[selected]||0;
      const addPayment = () => {
        if (!selected||!payForm.amount) return showToast("কাস্টমার ও পরিমাণ দিন","err");
        if (Number(payForm.amount)>due) return showToast(`বাকি মাত্র ৳${fmtNum(due)}`,"err");
        setPayments(p => [...p, { ...payForm, customer: selected, id: Date.now() }]);
        setPayForm({ date: today(), amount: "", bank: "হাতে নগদ", note: "" });
        showToast("পেমেন্ট সংরক্ষণ হয়েছে");
      };
      return (
        <div style={{ display: "grid", gridTemplateColumns: "260px 1fr", gap: 16, alignItems: "start" }}>
          <Card style={{ marginBottom: 0 }}>
            <h3 style={{ margin: "0 0 12px", fontSize: 14, color: "#1a5276" }}>👥 কাস্টমার তালিকা</h3>
            <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 খুঁজুন..."
              style={{ width: "100%", padding: "6px 10px", border: "1px solid #dde1e7", borderRadius: 8, fontSize: 13, marginBottom: 10, boxSizing: "border-box" }} />
            <div style={{ maxHeight: 500, overflowY: "auto" }}>
              {custList.map(c => {
                const d = customerDue[c]||0;
                return (
                  <div key={c} onClick={()=>setSelected(c)} style={{ padding: "10px 12px", borderRadius: 8, cursor: "pointer", marginBottom: 4, background: selected===c?"#1a5276":d>0?"#fff5f5":"#f8fafc", border: `1px solid ${selected===c?"#1a5276":d>0?"#ffcdd2":"#eee"}` }}>
                    <div style={{ fontWeight: 600, fontSize: 13, color: selected===c?"#fff":"#2c3e50" }}>{c}</div>
                    <div style={{ fontSize: 12, color: selected===c?"#a8d8ea":d>0?"#e74c3c":"#2ecc71", fontWeight: 600 }}>{d>0?`বাকি: ৳${fmtNum(d)}`:"✅ পরিশোধ"}</div>
                  </div>
                );
              })}
            </div>
          </Card>
          <div>
            {!selected ? <Card><div style={{ textAlign: "center", padding: 40, color: "#7f8c8d" }}>← কাস্টমার বেছে নিন</div></Card> : (
              <>
                <Card style={{ background: due>0?"#fff5f5":"#f0fff4", borderLeft: `4px solid ${due>0?"#e74c3c":"#2ecc71"}` }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                    <div>
                      <div style={{ fontWeight: 800, fontSize: 18, color: "#1a5276" }}>{selected}</div>
                      <div style={{ fontSize: 13, color: "#7f8c8d", marginTop: 2 }}>মোট বিক্রয়: ৳{fmtNum(custSales.reduce((s,r)=>s+Number(r.total||0),0))} | পরিশোধ: ৳{fmtNum(custPayments.reduce((s,r)=>s+Number(r.amount||0),0))}</div>
                    </div>
                    <div style={{ textAlign: "right" }}>
                      <div style={{ fontSize: 12, color: "#7f8c8d" }}>বর্তমান বাকি</div>
                      <div style={{ fontSize: 28, fontWeight: 900, color: due>0?"#e74c3c":"#2ecc71" }}>৳{fmtNum(due)}</div>
                    </div>
                  </div>
                </Card>
                {due>0 && (
                  <Card>
                    <h3 style={{ margin: "0 0 12px", fontSize: 14, color: "#1a5276" }}>💳 পেমেন্ট নিন</h3>
                    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr 1fr auto", gap: 10, alignItems: "end" }}>
                      <Input label="তারিখ" type="date" value={payForm.date} onChange={v=>setPayForm(f=>({...f,date:v}))} />
                      <Input label="পরিমাণ" type="number" value={payForm.amount} onChange={v=>setPayForm(f=>({...f,amount:v}))} placeholder={`সর্বোচ্চ ৳${fmtNum(due)}`} />
                      <Select label="মাধ্যম" value={payForm.bank} onChange={v=>setPayForm(f=>({...f,bank:v}))} options={["হাতে নগদ","DBBL","BRAC BANK","IBBL","bKash","Nagad"]} />
                      <Input label="নোট" value={payForm.note} onChange={v=>setPayForm(f=>({...f,note:v}))} placeholder="ঐচ্ছিক" />
                      <Btn onClick={addPayment} color="#2ecc71">✅ নিন</Btn>
                    </div>
                  </Card>
                )}
                <Card>
                  <h3 style={{ margin: "0 0 12px", fontSize: 14, color: "#1a5276" }}>📒 লেজার</h3>
                  {[...custSales.map(s=>({date:s.date,type:"বিক্রয়",desc:`${s.product}×${s.qty}`,debit:s.total,credit:0})),
                    ...custPayments.map(p=>({date:p.date,type:"পেমেন্ট",desc:p.note||p.bank,debit:0,credit:p.amount}))
                  ].sort((a,b)=>new Date(a.date)-new Date(b.date)).map((tx,i)=>(
                    <div key={i} style={{ display: "flex", justifyContent: "space-between", padding: "10px 0", borderBottom: "1px solid #eee", fontSize: 13 }}>
                      <div style={{ display: "flex", gap: 10 }}>
                        <span>{tx.type==="বিক্রয়"?"🧾":"💳"}</span>
                        <div>
                          <div style={{ fontWeight: 600 }}>{tx.type} — {tx.desc}</div>
                          <div style={{ fontSize: 11, color: "#7f8c8d" }}>{fmtDate(tx.date)}</div>
                        </div>
                      </div>
                      <div style={{ textAlign: "right" }}>
                        {tx.debit>0 && <div style={{ color: "#e74c3c", fontWeight: 700 }}>+৳{fmtNum(tx.debit)}</div>}
                        {tx.credit>0 && <div style={{ color: "#2ecc71", fontWeight: 700 }}>-৳{fmtNum(tx.credit)}</div>}
                      </div>
                    </div>
                  ))}
                </Card>
              </>
            )}
          </div>
        </div>
      );
    }

    // ══════════════════════════════════════════════════

                )}
                <Card>
                  <h3 style={{ margin: "0 0 12px", fontSize: 14, color: "#1a5276" }}>📒 লেজার</h3>
                  {[...suppPurchases.map(p=>({date:p.date,type:"ক্রয়",desc:`${p.product}×${p.qty}`,debit:p.total,credit:0})),
                    ...suppPayments.map(p=>({date:p.date,type:"পেমেন্ট",desc:p.note||p.bank,debit:0,credit:p.amount}))
                  ].sort((a,b)=>new Date(a.date)-new Date(b.date)).map((tx,i)=>(
                    <div key={i} style={{ display: "flex", justifyContent: "space-between", padding: "10px 0", borderBottom: "1px solid #eee", fontSize: 13 }}>
                      <div style={{ display: "flex", gap: 10 }}>
                        <span>{tx.type==="ক্রয়"?"🛒":"💳"}</span>
                        <div>
                          <div style={{ fontWeight: 600 }}>{tx.type} — {tx.desc}</div>
                          <div style={{ fontSize: 11, color: "#7f8c8d" }}>{fmtDate(tx.date)}</div>
                        </div>
                      </div>
                      <div style={{ textAlign: "right" }}>
                        {tx.debit>0 && <div style={{ color: "#f39c12", fontWeight: 700 }}>+৳{fmtNum(tx.debit)}</div>}
                        {tx.credit>0 && <div style={{ color: "#2ecc71", fontWeight: 700 }}>-৳{fmtNum(tx.credit)}</div>}
                      </div>
                    </div>
                  ))}
                </Card>
              </>
            )}
          </div>
        </div>
      );
    }

    // ══════════════════════════════════════════════════
    // BANK PAGE
    // ══════════════════════════════════════════════════
    function BankPage({ bankTx, setBankTx, banks, showToast }) {
      const [form, setForm] = useState({ date: today(), bank: "", type: "IN", amount: "", note: "" });
      const set = (k,v) => setForm(f=>({...f,[k]:v}));
      const balances = banks.map(b => {
        const inT = bankTx.filter(t=>t.bank===b&&t.type==="IN").reduce((s,t)=>s+Number(t.amount),0);
        const outT = bankTx.filter(t=>t.bank===b&&t.type==="OUT").reduce((s,t)=>s+Number(t.amount),0);
        return { bank: b, in: inT, out: outT, balance: inT-outT };
      });
      const submit = () => {
        if (!form.bank||!form.amount) return showToast("ব্যাংক ও পরিমাণ দিন","err");
        setBankTx(t=>[...t,{...form,id:Date.now()}]);
        setForm({ date: today(), bank: "", type: "IN", amount: "", note: "" });
        showToast("সংরক্ষণ হয়েছে");
      };
      return (
        <div>
          <div style={{ display: "flex", gap: 12, flexWrap: "wrap", marginBottom: 20 }}>
            {balances.map(b => (
              <div key={b.bank} style={{ background: "#fff", borderRadius: 12, padding: "14px 18px", boxShadow: "0 2px 8px rgba(0,0,0,0.06)", minWidth: 130, borderTop: `4px solid ${b.balance>=0?"#2ecc71":"#e74c3c"}` }}>
                <div style={{ fontSize: 13, fontWeight: 700, color: "#1a5276" }}>{b.bank}</div>
                <div style={{ fontSize: 20, fontWeight: 900, color: b.balance>=0?"#2ecc71":"#e74c3c", fontFamily: "monospace" }}>৳{fmtNum(b.balance)}</div>
                <div style={{ fontSize: 11, color: "#7f8c8d" }}>জমা: ৳{fmtNum(b.in)} | খরচ: ৳{fmtNum(b.out)}</div>
              </div>
            ))}
          </div>
          <Card>
            <h3 style={{ margin: "0 0 16px", fontSize: 15, color: "#1a5276" }}>🏦 নতুন লেনদেন</h3>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(140px,1fr))", gap: 12, alignItems: "end" }}>
              <Input label="তারিখ" type="date" value={form.date} onChange={v=>set("date",v)} />
              <Select label="ব্যাংক" value={form.bank} onChange={v=>set("bank",v)} options={banks} />
              <Select label="ধরন" value={form.type} onChange={v=>set("type",v)} options={["IN","OUT"]} />
              <Input label="পরিমাণ" type="number" value={form.amount} onChange={v=>set("amount",v)} placeholder="0" />
              <Input label="বিবরণ" value={form.note} onChange={v=>set("note",v)} placeholder="কেন?" />
              <Btn onClick={submit} color="#1a5276">💾 সংরক্ষণ</Btn>
            </div>
          </Card>
          <Card>
            <h3 style={{ margin: "0 0 12px", fontSize: 15, color: "#1a5276" }}>📋 লেনদেনের ইতিহাস</h3>
            <Table
              headers={["তারিখ","ব্যাংক","ধরন","পরিমাণ","বিবরণ","মুছুন"]}
              rows={[...bankTx].reverse().map(t => [
                fmtDate(t.date), t.bank,
                <span style={{ color: t.type==="IN"?"#2ecc71":"#e74c3c", fontWeight: 700 }}>{t.type==="IN"?"↑ জমা":"↓ খরচ"}</span>,
                <span style={{ fontWeight: 700, color: t.type==="IN"?"#2ecc71":"#e74c3c" }}>৳{fmtNum(t.amount)}</span>,
                t.note,
                <Btn small outline color="#e74c3c" onClick={()=>{setBankTx(tt=>tt.filter(x=>x.id!==t.id));showToast("মুছে ফেলা হয়েছে","err");}}>🗑️</Btn>
              ])}
            />
          </Card>
        </div>
      );
    }

    // ══════════════════════════════════════════════════
    // REPORT PAGE
    // ══════════════════════════════════════════════════
    function ReportPage({ sales, purchases, payments, supplierPay, customerDue, supplierDue, totalCustDue, totalSuppDue }) {
      const [month, setMonth] = useState(new Date().toISOString().slice(0,7));
      const fm = arr => arr.filter(r=>r.date&&r.date.startsWith(month));
      const mS = fm(sales); const mP = fm(purchases);
      const mPay = fm(payments); const mSP = fm(supplierPay);
      const tS = mS.reduce((s,r)=>s+Number(r.total||0),0);
      const tP = mP.reduce((s,r)=>s+Number(r.total||0),0);
      const tProfit = mS.reduce((s,r)=>s+Number(r.profit||0),0);
      const tPayIn = mPay.reduce((s,r)=>s+Number(r.amount||0),0);
      const topCD = Object.entries(customerDue).filter(([,v])=>v>0).sort(([,a],[,b])=>b-a).slice(0,8);
      const topSD = Object.entries(supplierDue).filter(([,v])=>v>0).sort(([,a],[,b])=>b-a).slice(0,8);
      return (
        <div>
          <Card>
            <div style={{ display: "flex", alignItems: "center", gap: 16 }}>
              <h3 style={{ margin: 0, fontSize: 15, color: "#1a5276" }}>📊 মাস বেছে নিন:</h3>
              <input type="month" value={month} onChange={e=>setMonth(e.target.value)}
                style={{ padding: "6px 12px", border: "1px solid #dde1e7", borderRadius: 8, fontSize: 14 }} />
            </div>
          </Card>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(150px,1fr))", gap: 12, marginBottom: 16 }}>
            {[
              { l: "মোট বিক্রয়", v: tS, c: "#2ecc71" },
              { l: "মোট ক্রয়", v: tP, c: "#3498db" },
              { l: "মোট লাভ", v: tProfit, c: tProfit>=0?"#27ae60":"#e74c3c" },
              { l: "নগদ প্রাপ্তি", v: tPayIn, c: "#8e44ad" },
            ].map(({l,v,c}) => (
              <div key={l} style={{ background: "#fff", borderRadius: 12, padding: "14px 16px", borderTop: `4px solid ${c}`, boxShadow: "0 2px 8px rgba(0,0,0,0.06)" }}>
                <div style={{ fontSize: 12, color: "#7f8c8d" }}>{l}</div>
                <div style={{ fontSize: 22, fontWeight: 900, color: c, fontFamily: "monospace" }}>৳{fmtNum(v)}</div>
              </div>
            ))}
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>
            <Card>
              <h3 style={{ margin: "0 0 12px", fontSize: 14, color: "#e74c3c" }}>🔴 কাস্টমার বাকি (সর্বোচ্চ)</h3>
              <div style={{ fontSize: 12, color: "#7f8c8d", marginBottom: 8 }}>মোট: ৳{fmtNum(totalCustDue)}</div>
              {topCD.map(([name,due]) => (
                <div key={name} style={{ display: "flex", justifyContent: "space-between", padding: "7px 0", borderBottom: "1px solid #eee", fontSize: 13 }}>
                  <span>{name}</span><span style={{ fontWeight: 700, color: "#e74c3c" }}>৳{fmtNum(due)}</span>
                </div>
              ))}
            </Card>
            <Card>
              <h3 style={{ margin: "0 0 12px", fontSize: 14, color: "#f39c12" }}>🟡 সাপ্লায়ার বাকি (সর্বোচ্চ)</h3>
              <div style={{ fontSize: 12, color: "#7f8c8d", marginBottom: 8 }}>মোট: ৳{fmtNum(totalSuppDue)}</div>
              {topSD.map(([name,due]) => (
                <div key={name} style={{ display: "flex", justifyContent: "space-between", padding: "7px 0", borderBottom: "1px solid #eee", fontSize: 13 }}>
                  <span>{name}</span><span style={{ fontWeight: 700, color: "#f39c12" }}>৳{fmtNum(due)}</span>
                </div>
              ))}
            </Card>
          </div>
        </div>
      );
    }

    // ══════════════════════════════════════════════════
    // MASTER LIST PAGE
    // ══════════════════════════════════════════════════
    function MasterPage({ customers, setCustomers, suppliers, setSuppliers, products, setProducts, showToast }) {
      const [tab, setTab] = useState("customer");
      const [newItem, setNewItem] = useState("");
      const [search, setSearch] = useState("");
      const lists = {
        customer: { label: "কাস্টমার", data: customers, set: setCustomers, icon: "👥" },
        supplier: { label: "সাপ্লায়ার", data: suppliers, set: setSuppliers, icon: "🏪" },
        product: { label: "পণ্য", data: products, set: setProducts, icon: "📦" },
      };
      const cur = lists[tab];
      const addItem = () => {
        const v = newItem.trim().toUpperCase();
        if (!v) return;
        if (cur.data.includes(v)) return showToast("এই নাম আগেই আছে","err");
        cur.set(d=>[...d,v]);
        setNewItem("");
        showToast(`${cur.label} যোগ হয়েছে`);
      };
      const filtered = cur.data.filter(d=>d.toLowerCase().includes(search.toLowerCase()));
      return (
        <div>
          <div style={{ display: "flex", gap: 8, marginBottom: 16 }}>
            {Object.entries(lists).map(([k,v]) => (
              <Btn key={k} small color={tab===k?"#1a5276":"#95a5a6"} onClick={()=>{setTab(k);setSearch("");setNewItem("");}}>
                {v.icon} {v.label} ({v.data.length})
              </Btn>
            ))}
          </div>
          <Card>
            <h3 style={{ margin: "0 0 12px", fontSize: 15, color: "#1a5276" }}>➕ নতুন {cur.label} যোগ করুন</h3>
            <div style={{ display: "flex", gap: 10 }}>
              <input value={newItem} onChange={e=>setNewItem(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addItem()}
                placeholder={`নতুন ${cur.label} এর নাম...`}
                style={{ flex: 1, padding: "8px 14px", border: "1px solid #dde1e7", borderRadius: 8, fontSize: 14 }} />
              <Btn onClick={addItem} color="#2ecc71">➕ যোগ করুন</Btn>
            </div>
            <div style={{ fontSize: 12, color: "#7f8c8d", marginTop: 8 }}>💡 এখানে যোগ করলে ক্রয়/বিক্রয় ফর্মে স্বয়ংক্রিয়ভাবে দেখাবে</div>
          </Card>
          <Card>
            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 12 }}>
              <h3 style={{ margin: 0, fontSize: 15, color: "#1a5276" }}>{cur.icon} {cur.label} ({filtered.length}টি)</h3>
              <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 খুঁজুন..."
                style={{ padding: "6px 12px", border: "1px solid #dde1e7", borderRadius: 8, fontSize: 13, width: 200 }} />
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(200px,1fr))", gap: 8 }}>
              {filtered.map(item => (
                <div key={item} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 12px", background: "#f8fafc", borderRadius: 8, border: "1px solid #eee" }}>
                  <span style={{ fontSize: 13 }}>{item}</span>
                  <button onClick={()=>{cur.set(d=>d.filter(x=>x!==item));showToast("মুছে ফেলা হয়েছে","err");}} style={{ background: "none", border: "none", cursor: "pointer", color: "#e74c3c", fontSize: 16 }}>🗑️</button>
                </div>
              ))}
            </div>
          </Card>
        </div>
      );
    }

    // ══════════════════════════════════════════════════
    // MAIN APP
    // ══════════════════════════════════════════════════
    function App() {
      const [page, setPage] = useState("home");
      const [menuOpen, setMenuOpen] = useState(false);
      const [customers, setCustomers] = useState(() => load("be_cust", INIT_CUSTOMERS));
      const [suppliers, setSuppliers] = useState(() => load("be_supp", INIT_SUPPLIERS));
      const [products, setProducts] = useState(() => load("be_prod", INIT_PRODUCTS));
      const [purchases, setPurchases] = useState(() => load("be_pur", []));
      const [sales, setSales] = useState(() => load("be_sal", []));
      const [payments, setPayments] = useState(() => load("be_pay", []));
      const [supplierPay, setSupplierPay] = useState(() => load("be_spay", []));
      const [bankTx, setBankTx] = useState(() => load("be_bank", []));
      const [toast, setToast] = useState(null);

      useEffect(() => { save("be_cust", customers); }, [customers]);
      useEffect(() => { save("be_supp", suppliers); }, [suppliers]);
      useEffect(() => { save("be_prod", products); }, [products]);
      useEffect(() => { save("be_pur", purchases); }, [purchases]);
      useEffect(() => { save("be_sal", sales); }, [sales]);
      useEffect(() => { save("be_pay", payments); }, [payments]);
      useEffect(() => { save("be_spay", supplierPay); }, [supplierPay]);
      useEffect(() => { save("be_bank", bankTx); }, [bankTx]);

      const showToast = (msg, type="ok") => { setToast({msg,type}); setTimeout(()=>setToast(null),2500); };

      const stockMap = useMemo(() => {
        const m = {};
        purchases.forEach(p => { m[p.product] = (m[p.product]||0) + Number(p.qty||0); });
        sales.forEach(s => { m[s.product] = (m[s.product]||0) - Number(s.qty||0); });
        return m;
      }, [purchases, sales]);

      const customerDue = useMemo(() => {
        const m = {};
        sales.forEach(s => { if(s.customer!=="CASH CASTOMAR") m[s.customer]=(m[s.customer]||0)+Number(s.total||0); });
        payments.forEach(p => { m[p.customer]=(m[p.customer]||0)-Number(p.amount||0); });
        return m;
      }, [sales, payments]);

      const supplierDue = useMemo(() => {
        const m = {};
        purchases.forEach(p => { m[p.supplier]=(m[p.supplier]||0)+Number(p.total||0); });
        supplierPay.forEach(p => { m[p.supplier]=(m[p.supplier]||0)-Number(p.amount||0); });
        return m;
      }, [purchases, supplierPay]);

      const totalSales = useMemo(() => sales.reduce((s,r)=>s+Number(r.total||0),0), [sales]);
      const totalPurchase = useMemo(() => purchases.reduce((s,r)=>s+Number(r.total||0),0), [purchases]);
      const totalCustDue = useMemo(() => Object.values(customerDue).filter(v=>v>0).reduce((a,b)=>a+b,0), [customerDue]);
      const totalSuppDue = useMemo(() => Object.values(supplierDue).filter(v=>v>0).reduce((a,b)=>a+b,0), [supplierDue]);

      const nav = [
        { id: "home", label: "🏠 ড্যাশবোর্ড" },
        { id: "purchase", label: "🛒 ক্রয় হিসাব" },
        { id: "sales", label: "💰 বিক্রয় হিসাব" },
        { id: "billsearch", label: "🔍 বিল সার্চ" },
        { id: "stock", label: "📦 স্টক" },
        { id: "customer", label: "👥 কাস্টমার বাকি" },
        { id: "supplier", label: "🏪 সাপ্লায়ার বাকি" },
        { id: "bank", label: "🏦 ব্যাংক / নগদ" },
        { id: "report", label: "📊 মাসিক রিপোর্ট" },
        { id: "master", label: "📋 মাস্টার লিস্ট" },
      ];

      const goTo = (id) => { setPage(id); setMenuOpen(false); };

      return (
        <div style={{ display: "flex", minHeight: "100vh", fontFamily: "'Noto Sans Bengali','Segoe UI',sans-serif", background: "#f0f4f8", fontSize: 14 }}>
          {/* SIDEBAR — desktop */}
          <div style={{ width: 200, background: "#1a3a5c", display: "flex", flexDirection: "column", padding: "0 0 20px", flexShrink: 0, position: "fixed", top: 0, left: 0, height: "100vh", zIndex: 100, overflowY: "auto" }}>
            <div style={{ padding: "18px 16px 14px", borderBottom: "1px solid #2c5282" }}>
              <div style={{ fontWeight: 800, fontSize: 15, color: "#fff" }}>Bulbul Enterprise</div>
              <div style={{ fontSize: 10, color: "#94a3b8", marginTop: 2 }}>নবাবপুর, ঢাকা</div>
            </div>
            <div style={{ flex: 1, paddingTop: 8 }}>
              {nav.map(n => (
                <div key={n.id} onClick={()=>goTo(n.id)} style={{ padding: "10px 16px", cursor: "pointer", background: page===n.id?"#2c5282":"transparent", borderLeft: page===n.id?"3px solid #2ecc71":"3px solid transparent", color: page===n.id?"#fff":"#94a3b8", fontSize: 13, transition: "all 0.15s" }}>
                  {n.label}
                </div>
              ))}
            </div>
            <div style={{ padding: "10px 16px", fontSize: 10, color: "#4a6fa5", borderTop: "1px solid #2c5282" }}>
              بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيم
            </div>
          </div>

          {/* MAIN CONTENT */}
          <div style={{ flex: 1, marginLeft: 200, overflow: "auto", minHeight: "100vh" }}>
            <div style={{ background: "#fff", padding: "14px 24px", borderBottom: "1px solid #dde1e7", display: "flex", justifyContent: "space-between", alignItems: "center", position: "sticky", top: 0, zIndex: 50 }}>
              <h1 style={{ margin: 0, fontSize: 18, fontWeight: 700, color: "#1a5276" }}>{nav.find(n=>n.id===page)?.label}</h1>
              <div style={{ fontSize: 12, color: "#7f8c8d" }}>{new Date().toLocaleDateString("bn-BD", {day:"2-digit",month:"long",year:"numeric"})}</div>
            </div>
            <div style={{ padding: 20 }}>
              {page==="home" && <HomePage totalSales={totalSales} totalPurchase={totalPurchase} totalCustDue={totalCustDue} totalSuppDue={totalSuppDue} stockMap={stockMap} sales={sales} purchases={purchases} />}
              {page==="purchase" && <PurchasePage purchases={purchases} setPurchases={setPurchases} suppliers={suppliers} products={products} showToast={showToast} />}
              {page==="sales" && <SalesPage sales={sales} setSales={setSales} customers={customers} products={products} showToast={showToast} stockMap={stockMap} purchases={purchases} />}
              {page==="billsearch" && <BillSearchPage sales={sales} purchases={purchases} />}
              {page==="stock" && <StockPage stockMap={stockMap} products={products} purchases={purchases} sales={sales} />}
              {page==="customer" && <CustomerDuePage customers={customers} customerDue={customerDue} payments={payments} setPayments={setPayments} sales={sales} showToast={showToast} />}
              {page==="supplier" && <SupplierDuePage suppliers={suppliers} supplierDue={supplierDue} supplierPay={supplierPay} setSupplierPay={setSupplierPay} purchases={purchases} showToast={showToast} />}
              {page==="bank" && <BankPage bankTx={bankTx} setBankTx={setBankTx} banks={INIT_BANKS} showToast={showToast} />}
              {page==="report" && <ReportPage sales={sales} purchases={purchases} payments={payments} supplierPay={supplierPay} customerDue={customerDue} supplierDue={supplierDue} totalCustDue={totalCustDue} totalSuppDue={totalSuppDue} />}
              {page==="master" && <MasterPage customers={customers} setCustomers={setCustomers} suppliers={suppliers} setSuppliers={setSuppliers} products={products} setProducts={setProducts} showToast={showToast} />}
            </div>
          </div>

          {/* TOAST */}
          {toast && (
            <div style={{ position: "fixed", bottom: 24, right: 24, zIndex: 999, background: toast.type==="ok"?"#2ecc71":"#e74c3c", color: "#fff", padding: "10px 20px", borderRadius: 10, fontWeight: 600, boxShadow: "0 4px 20px rgba(0,0,0,0.2)", fontSize: 13 }}>
              {toast.type==="ok"?"✅":"❌"} {toast.msg}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
