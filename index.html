<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bulbul Enterprise — হিসাব সিস্টেম</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1a3a5c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Bulbul Hisab" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.7.2/Recharts.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Sans Bengali', 'Segoe UI', sans-serif; background: #f0f4f8; color: #2c3e50; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; }
    ::-webkit-scrollbar-thumb { background: #1a3a5c; border-radius: 3px; }
    input, select, button { font-family: 'Noto Sans Bengali', 'Segoe UI', sans-serif; }
    
    /* প্রিন্ট করার জন্য বিশেষ সিএসএস (CSS) */
    @media print {
      body { background: white; color: black; }
      #root > div > nav, .no-print { display: none !important; }
      .print-area { display: block !important; padding: 20px; }
    }
    .print-area { display: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;
    const { BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, PieChart, Pie, Cell, Legend } = Recharts;

    // ══════════════════════════════════════════════════
    // লোকাল স্টোরেজ হেল্পারস
    // ══════════════════════════════════════════════════
    const load = (key, def) => {
      try {
        const v = localStorage.getItem(key);
        return v ? JSON.parse(v) : def;
      } catch { return def; }
    };
    const save = (key, val) => {
      try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
    };

    // ══════════════════════════════════════════════════
    // তারিখ ও সংখ্যা ফরম্যাট
    // ══════════════════════════════════════════════════
    const today = () => new Date().toISOString().split("T")[0];
    const fmtDate = (d) => {
      if (!d) return "";
      return new Date(d).toLocaleDateString("bn-BD", { day: "2-digit", month: "short", year: "numeric" });
    };
    const fmtNum = (n) => Number(n || 0).toLocaleString("bn-BD");

    // ══════════════════════════════════════════════════
    // ড্রপডাউন মাস্টার ডেটা
    // ══════════════════════════════════════════════════
    const INIT_CUSTOMERS = [
      "CASH CASTOMAR","DILRUBA EL LALBAG","KHOLIL EL LALBAG","TANJIL EL LALBAG",
      "AMIN EL LALBAG","EMONISTOR LALBAG","FATEMA EL LALBAG","FYSAL EL LALBAG",
      "KHAN EL LALBAG","DINAZPUR EL LALBAG","DR EL LALBAG","JAJIRA EL LALBAG",
      "MAERDOA EL LALBAG","MAERDOA NOBABPUR","MASUM EL LALBAG","MORIYOM EL LALBAG",
      "MUNSI EL LALBAG","NOAKHALI EL LALBAG","RITOM","ISLAM AND BROTHER",
      "HK POWER","IMRAN BONGSAL","JAFOR SURITOLA","MASUD DOAGONG",
      "MINTU EL MANIQGONG","RAJIA EL GORADOR","NOWAAKHALI EL","OMORFAARUK",
    ];
    const INIT_SUPPLIERS = [
      "RM LED LIGHTING","SAMIA ENTERPRISE","NEW AMENA EL","IMAM POWER",
      "IR ELECTRICK","AZAD LED","FLOORA CO K2 F2","NEW ISLAM EI K2",
      "SHARMIN TRADE IN","EAKIN EL","RAFIQ EL","BETAR EL","MOON SUPER",
      "OSAN","SWICH PAC ENG K2","GRAMIN","INTEX","BEST LINE HITEK CO",
      "MAX LINE","VEE","SHARIF ELECTRICK","KING BIDDUT BITAN","BONDHU LIGHTING",
      "RITOM EL","MADINA EL","RAJEN AND BROTHERS","JIHAD PIPE","TISA EL",
      "SP ELECTRIC CO","NABIL ENTERPRISE","ELECTRIC PALACE","GFC","JASHIRA EL HOUSE",
    ];
    const INIT_PRODUCTS = [
      "OSAKA CATA 40W","OSAKA CATA 20W","OSAKA CATA 60W","OSAKA ACDC 12W",
      "OSAKA ACDC 18.5W","OSAKA 20W","OSAKA 18W","OSAKA 40W","OSAKA 50W",
      "PS 20W","PS 12W","SS 20W","SSD 20W","SEIKO 20W","IC 5W D","IC 5W A",
      "IC 20W","ROCK STAR 20W","CHINA DIM LICHU","CHINA DIM TOMATO","CHINA 50W",
      "INTEX 34M2","INTEX 34M5","INTEX 33M5","INTEX 813M5","INTEX 814M5",
      "INTEX 23M5","INTEX 24M5","INTEX T STAR MALTY","BEST CTOP 2m","BEST CTOP 5m",
      "BEST LINE 315","BEST LINE 415","BEST LINE 515","MAX017 10F","MAX017 20F",
      "CAPACITOR 3.5","CAPACITOR 2.5","KOHLINUR 30A","KOHLINUR 15A","DP SWICH H",
      "DP SWICH N","CABOL CLIB 6MM","CABOL CLIB 7MM","CABOL CLIB 8MM","CABOL CLIB 10MM",
      "CABOL TAI 10IN","MK DIMAR NORMAL","CHALTHA NORMAL","OSAKA TAP","DEER TAP",
      "NOKIA","COLING BAL","IPS DIMAR","CONVATAR","LED TUB GLASS","DC T8 TUB",
      "GFC 12IN FAN","1HOL BOARD","3HOL BOARD","4HOL BOARD","TATAR",
      "G STAR PENDEL HOLDAR SAPTY","G STAR WINAR SWISS","MC RAJA PLACK",
      "PC SUPER DIMAR MK","VEE 503M5","VEE 504M5","VEE 505M5","VEE ACDC",
      "CANDAR 12W","COSCO 18W","SUN+ ACDC 20W","CLICK MALTY PLACK 4G",
    ];

    // ══════════════════════════════════════════════════
    // শেয়ারড UI কম্পোনেন্টসমূহ
    // ══════════════════════════════════════════════════
    const Card = ({ children, style = {} }) => (
      <div style={{ background: "#fff", borderRadius: 12, padding: 20, boxShadow: "0 2px 8px rgba(0,0,0,0.06)", marginBottom: 16, ...style }}>{children}</div>
    );

    const Btn = ({ children, onClick, color = "#1a5276", small = false, outline = false, disabled = false }) => (
      <button onClick={onClick} disabled={disabled} style={{
        background: outline ? "transparent" : color, color: outline ? color : "#fff",
        border: `2px solid ${color}`, borderRadius: 8,
        padding: small ? "5px 12px" : "8px 16px",
        cursor: disabled ? "not-allowed" : "pointer",
        fontWeight: 600, fontSize: small ? 12 : 13,
        outline: "none", transition: "all 0.2s",
        opacity: disabled ? 0.5 : 1,
      }} className="no-print">{children}</button>
    );

    const Input = ({ label, value, onChange, type = "text", list, required, placeholder }) => (
      <div style={{ marginBottom: 12 }} className="no-print">
        {label && <div style={{ fontSize: 12, fontWeight: 600, color: "#2c3e50", marginBottom: 4 }}>{label}{required && <span style={{ color: "red" }}> *</span>}</div>}
        <input type={type} value={value} onChange={e => onChange(e.target.value)} list={list} placeholder={placeholder}
          style={{ width: "100%", padding: "8px 12px", border: "1px solid #dde1e7", borderRadius: 8, fontSize: 13, boxSizing: "border-box", outline: "none" }} />
      </div>
    );

    const Select = ({ label, value, onChange, options }) => (
      <div style={{ marginBottom: 12 }} className="no-print">
        {label && <div style={{ fontSize: 12, fontWeight: 600, color: "#2c3e50", marginBottom: 4 }}>{label}</div>}
        <select value={value} onChange={e => onChange(e.target.value)}
          style={{ width: "100%", padding: "8px 12px", border: "1px solid #dde1e7", borderRadius: 8, fontSize: 13, background: "#fff", outline: "none" }}>
          <option value="">-- বেছে নিন --</option>
          {options.map(o => <option key={o} value={o}>{o}</option>)}
        </select>
      </div>
    );

    const Table = ({ headers, rows, emptyMsg = "কোনো তথ্য নেই" }) => (
      <div style={{ overflowX: "auto" }}>
        <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
          <thead>
            <tr style={{ background: "#1a3a5c" }}>
              {headers.map(h => <th key={h} style={{ padding: "10px 12px", color: "#fff", fontWeight: 600, textAlign: "left" }}>{h}</th>)}
            </tr>
          </thead>
          <tbody>
            {rows.length === 0
              ? <tr><td colSpan={headers.length} style={{ padding: 24, textAlign: "center", color: "#7f8c8d" }}>{emptyMsg}</td></tr>
              : rows.map((row, i) => (
                <tr key={i} style={{ background: i % 2 === 0 ? "#f8fafc" : "#fff", borderBottom: "1px solid #eee" }}>
                  {row.map((cell, j) => <td key={j} style={{ padding: "9px 12px", color: "#2c3e50" }}>{cell}</td>)}
                </tr>
              ))
            }
          </tbody>
        </table>
      </div>
    );

    // ══════════════════════════════════════════════════
    // ড্যাশবোর্ড স্ক্রিন (HOME)
    // ══════════════════════════════════════════════════
    const PIE_COLORS = ["#00d4aa","#54a0ff","#ff9f43","#ff6b6b"];

    function HomePage({ totalSales, totalPurchase, totalCustDue, totalSuppDue, stockMap, sales, purchases }) {
      const productSales = {};
      sales.forEach(s => { productSales[s.product] = (productSales[s.product] || 0) + Number(s.qty || 0); });
      const topProducts = Object.entries(productSales).sort(([,a],[,b]) => b-a).slice(0,5)
        .map(([name, qty]) => ({ name: name.length > 15 ? name.slice(0,15)+"…" : name, qty }));

      const totalProfit = sales.reduce((s,r) => s + Number(r.profit || 0), 0);
      const recentSales = [...sales].reverse().slice(0,5);

      const pieData = [
        { name: "বিক্রয়", value: totalSales },
        { name: "ক্রয়", value: totalPurchase },
        { name: "কাস্টমার বাকি", value: totalCustDue },
        { name: "সাপ্লায়ার বাকি", value: totalSuppDue }
      ].filter(d => d.value > 0);

      return (
        <div style={{ background: "linear-gradient(135deg, #0a0f1e 0%, #0d1b2a 100%)", minHeight: "100vh", margin: -20, padding: 20 }}>
          {/* কার্ডস গ্রিড */}
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(140px, 1fr))", gap: 12, marginBottom: 20 }}>
            {[
              { label: "মোট বিক্রয়", value: totalSales, color: "#00d4aa", bg: "#00d4aa15", icon: "💰" },
              { label: "মোট ক্রয়", value: totalPurchase, color: "#54a0ff", bg: "#54a0ff15", icon: "🛒" },
              { label: "মোট লাভ", value: totalProfit, color: "#2ecc71", bg: "#2ecc7115", icon: "📈" },
              { label: "কাস্টমার বাকি", value: totalCustDue, color: "#ff6b6b", bg: "#ff6b6b15", icon: "👥" },
              { label: "সাপ্লায়ার বাকি", value: totalSuppDue, color: "#ff9f43", bg: "#ff9f4315", icon: "🏪" },
            ].map((d,i) => (
              <div key={i} style={{ background: d.bg, border: `1px solid ${d.color}25`, borderRadius: 12, padding: 14 }}>
                <div style={{ fontSize: 20 }}>{d.icon}</div>
                <div style={{ fontSize: 16, fontWeight: 800, color: d.color, marginTop: 4 }}>৳{fmtNum(d.value)}</div>
                <div style={{ fontSize: 11, color: "#94a3b8", marginTop: 2 }}>{d.label}</div>
              </div>
            ))}
          </div>

          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(280px, 1fr))", gap: 16 }}>
            {/* টপ সেলস চার্ট */}
            <div style={{ background: "#0f172a", borderRadius: 12, padding: 16, border: "1px solid #1e293b" }}>
              <h4 style={{ color: "#fff", marginBottom: 12, fontSize: 14 }}>🏆 সর্বাধিক বিক্রিত পণ্য</h4>
              {topProducts.length === 0 ? <p style={{ color: "#475569", fontSize: 12 }}>কোনো ডেটা নেই</p> : (
                <ResponsiveContainer width="100%" height={180}>
                  <BarChart data={topProducts} layout="vertical">
                    <XAxis type="number" stroke="#64748b" fontSize={10} />
                    <YAxis type="category" dataKey="name" stroke="#64748b" fontSize={10} width={100} />
                    <Bar dataKey="qty" fill="#00d4aa" radius={[0,4,4,0]} name="পিস" />
                  </BarChart>
                </ResponsiveContainer>
              )}
            </div>

            {/* সাম্প্রতিক বিক্রয় তালিকা */}
            <div style={{ background: "#0f172a", borderRadius: 12, padding: 16, border: "1px solid #1e293b" }}>
              <h4 style={{ color: "#fff", marginBottom: 12, fontSize: 14 }}>🕐 সাম্প্রতিক ৫টি বিক্রয়</h4>
              {recentSales.map((s,i) => (
                <div key={i} style={{ display: "flex", justifyContent: "space-between", padding: "6px 0", borderBottom: "1px solid #1e293b", fontSize: 12 }}>
                  <div>
                    <div style={{ color: "#e2e8f0", fontWeight: 600 }}>{s.customer}</div>
                    <div style={{ color: "#64748b" }}>{s.product} (×{s.qty})</div>
                  </div>
                  <div style={{ color: "#00d4aa", fontWeight: 700 }}>৳{fmtNum(s.total)}</div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ══════════════════════════════════════════════════
    // ক্রয় পেজ (PURCHASE)
    // ══════════════════════════════════════════════════
    function PurchasePage({ purchases, setPurchases, suppliers, products, showToast }) {
      const [header, setHeader] = useState({ date: today(), supplier: "", memo: "", paid: "", bank: "হাতে নগদ" });
      const [lines, setLines] = useState([{ product: "", qty: "", price: "", discount: "", _id: Date.now() }]);
      const [search, setSearch] = useState("");

      const setH = (k, v) => setHeader(h => ({ ...h, [k]: v }));
      
      const setLine = (idx, k, v) => {
        setLines(ls => {
          const updated = ls.map((l, i) => i === idx ? { ...l, [k]: v } : l);
          const last = updated[updated.length - 1];
          if (idx === updated.length - 1 && (last.product || last.qty || last.price)) {
            return [...updated, { product: "", qty: "", price: "", discount: "", _id: Date.now() + Math.random() }];
          }
          return updated;
        });
      };

      const removeLine = (idx) => setLines(ls => ls.length > 1 ? ls.filter((_, i) => i !== idx) : ls);
      const lineTotal = (l) => (Number(l.qty || 0) * Number(l.price || 0)) - Number(l.discount || 0);
      const grandTotal = lines.reduce((s, l) => s + lineTotal(l), 0);
      const due = grandTotal - Number(header.paid || 0);

      const submit = () => {
        if (!header.supplier) return showToast("সাপ্লায়ারের নাম দিন", "err");
        const validLines = lines.filter(l => l.product && l.qty && l.price);
        if (validLines.length === 0) return showToast("কমপক্ষে একটি পণ্য যোগ করুন", "err");

        const memoId = Date.now();
        const entries = validLines.map((l, i) => ({
          ...header, product: l.product, qty: l.qty, price: l.price,
          discount: l.discount, total: lineTotal(l), due: i === 0 ? due : 0,
          memoId, id: memoId + i
        }));

        setPurchases(p => [...p, ...entries]);
        setHeader({ date: today(), supplier: "", memo: "", paid: "", bank: "হাতে নগদ" });
        setLines([{ product: "", qty: "", price: "", discount: "", _id: Date.now() }]);
        showToast("✅ ক্রয় রেকর্ড সফলভাবে সংরক্ষিত!");
      };

      // মেমো গ্রুপিং
      const grouped = [];
      const seen = new Set();
      [...purchases].reverse().forEach(p => {
        const key = p.memoId || p.id;
        if (!seen.has(key)) {
          seen.add(key);
          const group = purchases.filter(x => (x.memoId || x.id) === key);
          grouped.push({
            key, supplier: p.supplier, date: p.date, memo: p.memo,
            total: group.reduce((s, x) => s + Number(x.total || 0), 0),
            due: group[0]?.due || 0, items: group
          });
        }
      });

      const filtered = grouped.filter(g => g.supplier.toLowerCase().includes(search.toLowerCase()));

      return (
        <div>
          <datalist id="dl_sup">{suppliers.map(s => <option key={s} value={s} />)}</datalist>
          <datalist id="dl_pro">{products.map(p => <option key={p} value={p} />)}</datalist>
          
          <Card>
            <h3 style={{ margin: "0 0 12px", color: "#1a5276", fontSize: 15 }}>🛒 নতুন ক্রয় এন্ট্রি</h3>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(150px, 1fr))", gap: 10, background: "#eaf0fb", padding: 12, borderRadius: 8, marginBottom: 12 }}>
              <Input label="তারিখ" type="date" value={header.date} onChange={v => setH("date", v)} />
              <Input label="সাপ্লায়ার *" value={header.supplier} onChange={v => setH("supplier", v)} list="dl_sup" placeholder="নাম লিখুন" />
              <Input label="মেমো নং" value={header.memo} onChange={v => setH("memo", v)} placeholder="মেমো নম্বর" />
              <Input label="নগদ পরিশোধ" type="number" value={header.paid} onChange={v => setH("paid", v)} placeholder="0" />
              <Select label="মাধ্যম" value={header.bank} onChange={v => setH("bank", v)} options={["হাতে নগদ", "bKash", "Nagad", "Bank"]} />
            </div>

            {/* প্রোডাক্ট গ্রিড টেবিল */}
            <div style={{ border: "1px solid #dde1e7", borderRadius: 8, overflow: "hidden", marginBottom: 12 }}>
              <div style={{ display: "grid", gridTemplateColumns: "3fr 1fr 1fr 1fr 40px", padding: 8, background: "#1a3a5c", color: "#fff", fontSize: 12, fontWeight: 600 }}>
                <div>পণ্যের নাম</div><div>পরিমাণ</div><div>ক্রয়মূল্য</div><div>ছাড়</div><div></div>
              </div>
              {lines.map((l, idx) => (
                <div key={l._id} style={{ display: "grid", gridTemplateColumns: "3fr 1fr 1fr 1fr 40px", padding: 6, gap: 6, alignItems: "center", borderBottom: "1px solid #eee" }}>
                  <input value={l.product} onChange={e => setLine(idx, "product", e.target.value)} list="dl_pro" placeholder="পণ্য বাছুন" style={{ padding: 6, border: "1px solid #ccc", borderRadius: 4, fontSize: 12 }} />
                  <input type="number" value={l.qty} onChange={e => setLine(idx, "qty", e.target.value)} placeholder="0" style={{ padding: 6, border: "1px solid #ccc", borderRadius: 4, fontSize: 12 }} />
                  <input type="number" value={l.price} onChange={e => setLine(idx, "price", e.target.value)} placeholder="0" style={{ padding: 6, border: "1px solid #ccc", borderRadius: 4, fontSize: 12 }} />
                  <input type="number" value={l.discount} onChange={e => setLine(idx, "discount", e.target.value)} placeholder="0" style={{ padding: 6, border: "1px solid #ccc", borderRadius: 4, fontSize: 12 }} />
                  <button onClick={() => removeLine(idx)} disabled={lines.length===1} style={{ color: "red", background: "none", border: "none", fontSize: 16, cursor: "pointer" }}>🗑️</button>
                </div>
              ))}
            </div>

            <div style={{ display: "flex", justifyValue: "space-between", alignItems: "center", flexWrap: "wrap", gap: 10, background: "#f8fafc", padding: 10, borderRadius: 6 }}>
              <div style={{ fontSize: 13 }}>সর্বমোট: <strong>৳{fmtNum(grandTotal)}</strong> | বাকি: <strong style={{ color: due>0?"red":"green" }}>৳{fmtNum(due)}</strong></div>
              <div style={{ marginLeft: "auto" }}><Btn onClick={submit}>💾 ক্রয় সেভ করুন</Btn></div>
            </div>
          </Card>

          {/* ক্রয়ের তালিকা */}
          <Card>
            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 12 }}>
              <h4 style={{ fontSize: 14 }}>📋 ক্রয়ের ইতিহাস</h4>
              <input placeholder="🔍 খুঁজুন..." value={search} onChange={e => setSearch(e.target.value)} style={{ padding: "4px 8px", borderRadius: 6, border: "1px solid #ccc", fontSize: 12 }} />
            </div>
            {filtered.map(g => (
              <div key={g.key} style={{ border: "1px solid #e2e8f0", borderRadius: 8, marginBottom: 10, overflow: "hidden" }}>
                <div style={{ background: "#f1f5f9", padding: "8px 12px", display: "flex", justifyContent: "space-between", fontSize: 12, fontWeight: 600 }}>
                  <span>🏪 {g.supplier} (মেমো: #{g.memo || "N/A"}) - {fmtDate(g.date)}</span>
                  <span style={{ color: "#1a5276" }}>মোট বিল: ৳{fmtNum(g.total)} | বাকি: ৳{fmtNum(g.due)}</span>
                </div>
                {g.items.map((it, i) => (
                  <div key={i} style={{ padding: "6px 12px", fontSize: 12, borderBottom: "1px solid #f1f5f9", display: "flex", justifyValue: "space-between" }}>
                    <span>📦 {it.product} (×{it.qty} পিস)</span>
                    <span style={{ marginLeft: "auto" }}>৳{fmtNum(it.total)}</span>
                  </div>
                ))}
              </div>
            ))}
          </Card>
        </div>
      );
    }

    // ══════════════════════════════════════════════════
    // বিক্রয় পেজ ও ইনভয়েস জেনারেটর (SALES)
    // ══════════════════════════════════════════════════
    function SalesPage({ sales, setSales, customers, products, purchases, stockMap, showToast, onPrintMemo }) {
      const [header, setHeader] = useState({ date: today(), customer: "", billNo: "", paid: "", bank: "হাতে নগদ" });
      const [lines, setLines] = useState([{ product: "", qty: "", price: "", discount: "", _id: Date.now() }]);
      const [search, setSearch] = useState("");

      const setH = (k, v) => setHeader(h => ({ ...h, [k]: v }));

      const getCostPrice = (prod) => {
        const last = [...purchases].reverse().find(p => p.product === prod);
        return last ? Number(last.price || 0) : 0;
      };

      const setLine = (idx, k, v) => {
        setLines(ls => {
          const updated = ls.map((l, i) => i === idx ? { ...l, [k]: v } : l);
          const last = updated[updated.length - 1];
          if (idx === updated.length - 1 && (last.product || last.qty || last.price)) {
            return [...updated, { product: "", qty: "", price: "", discount: "", _id: Date.now() + Math.random() }];
          }
          return updated;
        });
      };

      const removeLine = (idx) => setLines(ls => ls.length > 1 ? ls.filter((_, i) => i !== idx) : ls);
      const lineTotal = (l) => (Number(l.qty || 0) * Number(l.price || 0)) - Number(l.discount || 0);
      const grandTotal = lines.reduce((s, l) => s + lineTotal(l), 0);
      const due = header.customer === "CASH CASTOMAR" ? 0 : grandTotal - Number(header.paid || 0);

      const submit = () => {
        if (!header.customer) return showToast("কাস্টমারের নাম দিন", "err");
        const validLines = lines.filter(l => l.product && l.qty && l.price);
        if (validLines.length === 0) return showToast("কমপক্ষে একটি পণ্য যোগ করুন", "err");

        // স্টক ভ্যালিডেশন চেক
        for (let l of validLines) {
          const currentStock = stockMap[l.product] || 0;
          if (Number(l.qty) > currentStock) {
            return showToast(`❌ দুঃখিত! ${l.product} স্টকে মাত্র ${currentStock}টি আছে!`, "err");
          }
        }

        const billId = Date.now();
        const entries = validLines.map((l, i) => {
          const cp = getCostPrice(l.product);
          const total = lineTotal(l);
          const profit = total - (cp * Number(l.qty || 0));
          return {
            ...header, product: l.product, qty: l.qty, price: l.price,
            discount: l.discount, total, profit, due: i === 0 ? due : 0,
            billId, id: billId + i
          };
        });

        setSales(s => [...s, ...entries]);
        setHeader({ date: today(), customer: "", billNo: "", paid: "", bank: "হাতে নগদ" });
        setLines([{ product: "", qty: "", price: "", discount: "", _id: Date.now() }]);
        showToast("✅ বিক্রয় সফলভাবে সম্পন্ন হয়েছে!");
      };

      // সেলস মেমো গ্রুপিং (সংশোধিত অংশ)
      const grouped = [];
      const seen = new Set();
      [...sales].reverse().forEach(s => {
        const key = s.billId || s.id;
        if (!seen.has(key)) {
          seen.add(key);
          const group = sales.filter(x => (x.billId || x.id) === key);
          grouped.push({
            key, customer: s.customer, date: s.date, billNo: s.billNo,
            total: group.reduce((sum, x) => sum + Number(x.total || 0), 0),
            paid: group[0]?.paid || 0,
            due: group[0]?.due || 0, group
          });
        }
      });

      const filtered = grouped.filter(g => g.customer.toLowerCase().includes(search.toLowerCase()) || (g.billNo && g.billNo.includes(search)));

      return (
        <div>
          <datalist id="dl_cus">{customers.map(c => <option key={c} value={c} />)}</datalist>
          <datalist id="dl_pro">{products.map(p => <option key={p} value={p} />)}</datalist>

          <Card>
            <h3 style={{ margin: "0 0 12px", color: "#2e7d32", fontSize: 15 }}>💰 নতুন বিক্রয় (মেমো তৈরি)</h3>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(150px, 1fr))", gap: 10, background: "#e8f5e9", padding: 12, borderRadius: 8, marginBottom: 12 }}>
              <Input label="তারিখ" type="date" value={header.date} onChange={v => setH("date", v)} />
              <Input label="কাস্টমার নাম *" value={header.customer} onChange={v => setH("customer", v)} list="dl_cus" placeholder="নাম লিখুন" />
              <Input label="চালান / বিল নং" value={header.billNo} onChange={v => setH("billNo", v)} placeholder="বিল নম্বর" />
              <Input label="নগদ গ্রহণ" type="number" value={header.paid} onChange={v => setH("paid", v)} placeholder="0" />
              <Select label="জমার মাধ্যম" value={header.bank} onChange={v => setH("bank", v)} options={["হাতে নগদ", "bKash", "Nagad", "Bank"]} />
            </div>

            <div style={{ border: "1px solid #dde1e7", borderRadius: 8, overflow: "hidden", marginBottom: 12 }}>
              <div style={{ display: "grid", gridTemplateColumns: "3fr 1fr 1fr 1fr 40px", padding: 8, background: "#2e7d32", color: "#fff", fontSize: 12, fontWeight: 600 }}>
                <div>পণ্যের নাম</div><div>পরিমাণ</div><div>বিক্রয়মূল্য</div><div>ছাড়</div><div></div>
              </div>
              {lines.map((l, idx) => (
                <div key={l._id} style={{ display: "grid", gridTemplateColumns: "3fr 1fr 1fr 1fr 40px", padding: 6, gap: 6, alignItems: "center", borderBottom: "1px solid #eee" }}>
                  <input value={l.product} onChange={e => setLine(idx, "product", e.target.value)} list="dl_pro" placeholder="পণ্য বাছুন" style={{ padding: 6, border: "1px solid #ccc", borderRadius: 4, fontSize: 12 }} />
                  <input type="number" value={l.qty} onChange={e => setLine(idx, "qty", e.target.value)} placeholder="0" style={{ padding: 6, border: "1px solid #ccc", borderRadius: 4, fontSize: 12 }} />
                  <input type="number" value={l.price} onChange={e => setLine(idx, "price", e.target.value)} placeholder="0" style={{ padding: 6, border: "1px solid #ccc", borderRadius: 4, fontSize: 12 }} />
                  <input type="number" value={l.discount} onChange={e => setLine(idx, "discount", e.target.value)} placeholder="0" style={{ padding: 6, border: "1px solid #ccc", borderRadius: 4, fontSize: 12 }} />
                  <button onClick={() => removeLine(idx)} disabled={lines.length===1} style={{ color: "red", background: "none", border: "none", fontSize: 16, cursor: "pointer" }}>🗑️</button>
                </div>
              ))}
            </div>

            <div style={{ display: "flex", justifyValue: "space-between", alignItems: "center", flexWrap: "wrap", gap: 10, background: "#f8fafc", padding: 10, borderRadius: 6 }}>
              <div style={{ fontSize: 13 }}>সর্বমোট বিল: <strong>৳{fmtNum(grandTotal)}</strong> | বাকি: <strong style={{ color: due>0?"red":"green" }}>৳{fmtNum(due)}</strong></div>
              <div style={{ marginLeft: "auto" }}><Btn onClick={submit} color="#2e7d32">💾 বিক্রয় সম্পন্ন করুন</Btn></div>
            </div>
          </Card>

          {/* বিক্রয় খাতা ও প্রিন্ট তালিকা */}
          <Card>
            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 12 }}>
              <h4 style={{ fontSize: 14 }}>📋 বিক্রয়ের ইতিহাস (ক্যাশ মেমো সমূহ)</h4>
              <input placeholder="🔍 খুঁজুন..." value={search} onChange={e => setSearch(e.target.value)} style={{ padding: "4px 8px", borderRadius: 6, border: "1px solid #ccc", fontSize: 12 }} />
            </div>
            {filtered.map(g => (
              <div key={g.key} style={{ border: "1px solid #e2e8f0", borderRadius: 8, marginBottom: 10, overflow: "hidden" }}>
                <div style={{ background: "#f1f5f9", padding: "8px 12px", display: "flex", justifyContent: "space-between", alignItems: "center", fontSize: 12, fontWeight: 600 }}>
                  <span>👥 {g.customer} (বিল: #{g.billNo || "N/A"}) - {fmtDate(g.date)}</span>
                  <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
                    <span style={{ color: "#2e7d32" }}>বিল: ৳{fmtNum(g.total)} | বাকি: ৳{fmtNum(g.due)}</span>
                    <Btn small color="#3498db" onClick={() => onPrintMemo(g)}>🖨️ প্রিন্ট / PDF</Btn>
                  </div>
                </div>
                {g.group.map((it, i) => (
                  <div key={i} style={{ padding: "6px 12px", fontSize: 12, borderBottom: "1px solid #f1f5f9", display: "flex", justifyValue: "space-between" }}>
                    <span>📦 {it.product} (×{it.qty} পিস)</span>
                    <span style={{ marginLeft: "auto" }}>৳{fmtNum(it.total)}</span>
                  </div>
                ))}
              </div>
            ))}
          </Card>
        </div>
      );
    }

    // ══════════════════════════════════════════════════
    // স্টক ইনভেন্টরি পেজ (SOTCK)
    // ══════════════════════════════════════════════════
    function StockPage({ stockMap, products, purchases }) {
      const [search, setSearch] = useState("");
      
      const rows = useMemo(() => {
        return products.map(name => {
          const qty = stockMap[name] || 0;
          const matched = purchases.filter(p => p.product === name);
          const totalQty = matched.reduce((s, x) => s + Number(x.qty || 0), 0);
          const totalCost = matched.reduce((s, x) => s + Number(x.total || 0), 0);
          const avgPrice = totalQty > 0 ? (totalCost / totalQty) : 0;
          return { name, qty, avgPrice, totalValue: qty * avgPrice };
        }).filter(r => r.name.toLowerCase().includes(search.toLowerCase()));
      }, [stockMap, products, purchases, search]);

      return (
        <Card>
          <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 12 }}>
            <h3 style={{ fontSize: 15 }}>📦 স্টক খাতা (গড় ক্রয়মূল্য সহ)</h3>
            <input placeholder="🔍 পণ্য খুঁজুন..." value={search} onChange={e => setSearch(e.target.value)} style={{ padding: "4px 8px", borderRadius: 6, border: "1px solid #ccc", fontSize: 12 }} />
          </div>
          <Table 
            headers={["পণ্যের নাম", "স্টক পরিমাণ", "গড় ক্রয়মূল্য", "মোট স্টক মূল্য"]}
            rows={rows.map(r => [
              r.name,
              <span style={{ fontWeight: 700, color: r.qty <= 5 ? "orange" : "inherit" }}>{r.qty} পিস</span>,
              `৳${fmtNum(r.avgPrice.toFixed(1))}`,
              `৳${fmtNum(r.totalValue.toFixed(0))}`
            ])}
          />
        </Card>
      );
    }

    // ══════════════════════════════════════════════════
    // কাস্টমার লেজার বা বাকি খাতা (CUSTOMER LEDGER)
    // ══════════════════════════════════════════════════
    function CustomerLedgerPage({ sales, customers }) {
      const [search, setSearch] = useState("");

      const rows = useMemo(() => {
        return customers.map(c => {
          const cSales = sales.filter(s => s.customer === c);
          const total = cSales.reduce((sum, s) => sum + Number(s.total || 0), 0);
          
          const seenMemos = new Set();
          let due = 0;
          cSales.forEach(s => {
            const key = s.billId || s.id;
            if(!seenMemos.has(key)) {
              seenMemos.add(key);
              due += Number(s.due || 0);
            }
          });
          return { name: c, total, due, paid: total - due };
        }).filter(r => r.name.toLowerCase().includes(search.toLowerCase()) && r.total > 0);
      }, [sales, customers, search]);

      return (
        <Card>
          <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 12 }}>
            <h3 style={{ fontSize: 15 }}>👥 কাস্টমার বাকি ও লেজার খাতা</h3>
            <input placeholder="🔍 কাস্টমার খুঁজুন..." value={search} onChange={e => setSearch(e.target.value)} style={{ padding: "4px 8px", borderRadius: 6, border: "1px solid #ccc", fontSize: 12 }} />
          </div>
          <Table 
            headers={["কাস্টমার নাম", "মোট বিক্রয়", "মোট জমা", "মোট বাকি"]}
            rows={rows.map(r => [
              r.name, `৳${fmtNum(r.total)}`, `৳${fmtNum(r.paid)}`,
              <span style={{ fontWeight: 700, color: r.due > 0 ? "red" : "green" }}>৳{fmtNum(r.due)}</span>
            ])}
          />
        </Card>
      );
    }

    // ══════════════════════════════════════════════════
    // সেটিংস ও ব্যাকআপ পেজ (SETTINGS)
    // ══════════════════════════════════════════════════
    function SettingsPage({ onClear }) {
      const exportData = () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(localStorage));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `bulbul_hisab_backup.json`);
        downloadAnchor.click();
      };

      return (
        <Card>
          <h3 style={{ color: "red", fontSize: 15, marginBottom: 12 }}>⚙️ সেটিংস ও ব্যাকআপ</h3>
          <p style={{ fontSize: 13, marginBottom: 16, color: "#555" }}>আপনার ব্যবসার হিসাব সুরক্ষিত রাখতে নিয়মিত ব্যাকআপ ফাইল ডাউনলোড করে রাখুন।</p>
          <div style={{ display: "flex", gap: 12 }}>
            <Btn onClick={exportData} color="#2ecc71">📥 ব্যাকআপ ফাইল ডাউনলোড করুন</Btn>
            <Btn onClick={onClear} color="#e74c3c">🗑️ সব ডেটা রিসেট করুন</Btn>
          </div>
        </Card>
      );
    }

    // ══════════════════════════════════════════════════
    // প্রিন্ট উপযোগী ক্যাশ মেমো টেমপ্লেট
    // ══════════════════════════════════════════════════
    function PrintMemoTemplate({ memo, onClose }) {
      if (!memo) return null;
      return (
        <div className="print-area" style={{ background: "#fff", minHeight: "100vh", padding: 20, color: "#000" }}>
          {/* মেমো হেডার */}
          <div style={{ display: "flex", justifyContent: "space-between", borderBottom: "2px solid #1a3a5c", paddingBottom: 10, marginBottom: 15 }}>
            <div>
              <h1 style={{ fontSize: 24, fontWeight: 800, color: "#1a3a5c" }}>বুলবুল এন্টারপ্রাইজ</h1>
              <p style={{ fontSize: 12 }}>ইসলাম ইলেকট্রিক মার্কেট, দোকান নং-১৪, কাজী আঃ হামিদ লেন, নবাবপুর, ঢাকা</p>
              <p style={{ fontSize: 12 }}>মোবাইল: ০১৭১২-৯২৭৯৯৫</p>
            </div>
            <div style={{ textAlign: "right", fontSize: 12 }}>
              <span style={{ background: "#1a3a5c", color: "#fff", padding: "3px 8px", borderRadius: 4, fontWeight: "bold" }}>ক্যাশ মেমো</span>
              <p style={{ marginTop: 6 }}><strong>বিল নং:</strong> #{memo.billNo || memo.key}</p>
              <p><strong>তারিখ:</strong> {fmtDate(memo.date)}</p>
            </div>
          </div>

          <div style={{ background: "#f9f9f9", padding: 8, borderRadius: 4, marginBottom: 15, fontSize: 13, border: "1px solid #eee" }}>
            <strong>ক্রেতার নাম:</strong> {memo.customer}
          </div>

          {/* মেমো আইটেম টেবিল */}
          <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12, marginBottom: 15 }}>
            <thead>
              <tr style={{ background: "#f2f2f2", borderBottom: "2px solid #000" }}>
                <th style={{ padding: 6, textAlign: "left" }}>ক্রঃ</th>
                <th style={{ padding: 6, textAlign: "left" }}>বিবরণ / পণ্যের নাম</th>
                <th style={{ padding: 6, textAlign: "center" }}>পরিমাণ</th>
                <th style={{ padding: 6, textAlign: "right" }}>দর (৳)</th>
                <th style={{ padding: 6, textAlign: "right" }}>মোট মূল্য (৳)</th>
              </tr>
            </thead>
            <tbody>
              {memo.group.map((item, idx) => (
                <tr key={idx} style={{ borderBottom: "1px solid #eee" }}>
                  <td style={{ padding: 6 }}>{idx + 1}</td>
                  <td style={{ padding: 6 }}>{item.product}</td>
                  <td style={{ padding: 6, textAlign: "center" }}>{item.qty} পিস</td>
                  <td style={{ padding: 6, textAlign: "right" }}>{fmtNum(item.price)}</td>
                  <td style={{ padding: 6, textAlign: "right" }}>{fmtNum(item.total)}</td>
                </tr>
              ))}
            </tbody>
          </table>

          {/* মেমো টোটাল এরিয়া */}
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
            <div style={{ fontSize: 11, italic: "true", color: "#555" }}>* বিক্রীত মাল ফেরত নেওয়া হয় না।</div>
            <div style={{ width: 200, fontSize: 13 }}>
              <div style={{ display: "flex", justifyContent: "space-between", padding: "2px 0" }}><span>মোট বিল:</span><span>৳{fmtNum(memo.total)}</span></div>
              <div style={{ display: "flex", justifyContent: "space-between", padding: "2px 0", borderBottom: "1px solid #000" }}><span>নগদ গ্রহণ:</span><span>৳{fmtNum(memo.paid)}</span></div>
              <div style={{ display: "flex", justifyContent: "space-between", padding: "4px 0", fontWeight: "bold" }}><span>বাকি:</span><span>৳{fmtNum(memo.due)}</span></div>
            </div>
          </div>

          <div style={{ display: "flex", justifyContent: "space-between", marginTop: 40 }} className="no-print">

            <Btn onClick={() => window.print()} color="#1a3a5c">🖨️ প্রিন্ট করুন / Save PDF</Btn>
          </div>
        </div>
      );
    }

    // ══════════════════════════════════════════════════
    // মেইন অ্যাপ কন্ট্রোলার (MAIN APP)
    // ══════════════════════════════════════════════════
    function App() {
      const [tab, setTab] = useState("home");
      const [sales, setSales] = useState(() => load("b_sales", []));
      const [purchases, setPurchases] = useState(() => load("b_purchases", []));
      const [toast, setToast] = useState(null);
      const [activePrintMemo, setActivePrintMemo] = useState(null);

      useEffect(() => { save("b_sales", sales); }, [sales]);
      useEffect(() => { save("b_purchases", purchases); }, [purchases]);

      const showToast = (msg, type = "success") => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 3000);
      };

      // ইনভেন্টরি স্টক ম্যাপ ক্যালকুলেশন
      const stockMap = useMemo(() => {
        const map = {};
        INIT_PRODUCTS.forEach(p => map[p] = 0);
        purchases.forEach(p => { if(p.product) map[p.product] = (map[p.product] || 0) + Number(p.qty || 0); });
        sales.forEach(s => { if(s.product) map[s.product] = (map[s.product] || 0) - Number(s.qty || 0); });
        return map;
      }, [sales, purchases]);

      const totalSales = useMemo(() => sales.reduce((sum, r) => sum + Number(r.total || 0), 0), [sales]);
      const totalPurchase = useMemo(() => purchases.reduce((sum, r) => sum + Number(r.total || 0), 0), [purchases]);
      
      const totalCustDue = useMemo(() => {
        const seen = new Set();
        return sales.reduce((sum, r) => {
          const key = r.billId || r.id;
          if (!seen.has(key)) { seen.add(key); return sum + Number(r.due || 0); }
          return sum;
        }, 0);
      }, [sales]);

      const totalSuppDue = useMemo(() => {
        const seen = new Set();
        return purchases.reduce((sum, r) => {
          const key = r.memoId || r.id;
          if (!seen.has(key)) { seen.add(key); return sum + Number(r.due || 0); }
          return sum;
        }, 0);
      }, [purchases]);

      const handleClearAll = () => {
        if (confirm("⚠️ আপনি কি নিশ্চিত যে সমস্ত ডেটা মুছে ফেলতে চান? এটি আর ফিরিয়ে আনা যাবে না!")) {
          localStorage.clear();
          setSales([]);
          setPurchases([]);
          showToast("♻️ সমস্ত তথ্য মুছে ফেলা হয়েছে", "err");
          setTab("home");
        }
      };

      if (activePrintMemo) {
        return <PrintMemoTemplate memo={activePrintMemo} onClose={() => setActivePrintMemo(null)} />;
      }

      return (
        <div>
          {toast && (
            <div style={{ position: "fixed", top: 20, right: 20, zIndex: 9999, background: toast.type === "err" ? "#e74c3c" : "#2ecc71", color: "#fff", padding: "10px 20px", borderRadius: 8, fontWeight: 600, fontSize: 13 }}>
              {toast.msg}
            </div>
          )}

          <nav style={{ background: "#1a3a5c", padding: "0 10px", display: "flex", gap: 5, overflowX: "auto", whiteSpace: "nowrap", borderBottom: "3px solid #00d4aa" }} className="no-print">
            <div style={{ color: "#fff", fontWeight: 800, padding: "12px 8px", fontSize: 14 }}>⚡ বুলবুল হিসাব</div>
            {[
              { id: "home", label: "📊 ড্যাশবোর্ড" },
              { id: "sales", label: "💰 বিক্রয় খাতা" },
              { id: "purchase", label: "🛒 ক্রয় খাতা" },
              { id: "stock", label: "📦 স্টক ইনভেন্টরি" },
              { id: "customer", label: "👥 কাস্টমার লেজার" },
              { id: "settings", label: "⚙️ সেটিংস" }
            ].map(t => (
              <button key={t.id} onClick={() => setTab(t.id)} style={{
                background: tab === t.id ? "#00d4aa" : "transparent", color: tab === t.id ? "#1a3a5c" : "#fff",
                border: "none", padding: "12px 14px", cursor: "pointer", fontWeight: 700, fontSize: 12
              }}>{t.label}</button>
            ))}
          </nav>

          <div style={{ padding: 20 }} className="no-print">
            {tab === "home" && <HomePage totalSales={totalSales} totalPurchase={totalPurchase} totalCustDue={totalCustDue} totalSuppDue={totalSuppDue} stockMap={stockMap} sales={sales} purchases={purchases} />}
            {tab === "purchase" && <PurchasePage purchases={purchases} setPurchases={setPurchases} suppliers={INIT_SUPPLIERS} products={INIT_PRODUCTS} showToast={showToast} />}
            {tab === "sales" && <SalesPage sales={sales} setSales={setSales} customers={INIT_CUSTOMERS} products={INIT_PRODUCTS} purchases={purchases} stockMap={stockMap} showToast={showToast} onPrintMemo={setActivePrintMemo} />}
            {tab === "stock" && <StockPage stockMap={stockMap} products={INIT_PRODUCTS} purchases={purchases} />}
            {tab === "customer" && <CustomerLedgerPage sales={sales} customers={INIT_CUSTOMERS} />}
            {tab === "settings" && <SettingsPage onClear={handleClearAll} />}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
